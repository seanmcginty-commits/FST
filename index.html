async function runReport(){
  var r=reportDefaults();
  if(!r.from || !r.to || r.from>r.to){ r.error='Please choose a valid date range.'; return render(); }
  if(Sched.diffDays(r.to, r.from)>91){ r.error='Please choose 92 days or fewer.'; return render(); }
  r.busy=true; r.error=''; r.result=null; render();
  try{
    var sites = r.site==='all' ? adminSites() : adminSites().filter(function(s){ return s.id===r.site; });
    var ids=sites.map(function(s){ return s.id; });
    var tasks=[], sections=[];
    for(var i=0;i<ids.length;i+=20){
      var b=ids.slice(i,i+20);
      tasks=tasks.concat(await fetchAll(function(){ return sb.from('tasks').select('*').in('site_id', b).order('id'); }));
      sections=sections.concat(await fetchAll(function(){ return sb.from('sections').select('id,name,site_id,sort_order').in('site_id', b).order('id'); }));
    }
    var data=await loadRange(ids, r.from, r.to);
    var map={}; data.comps.forEach(function(c){ map[compKey(c.task_id,c.occurrence_date)]=c; });
    var secName={}, secOrder={}; sections.forEach(function(s){ secName[s.id]=s.name; secOrder[s.id]=s.sort_order||0; });
    var perSite=sites.map(function(s){
      var today=Sched.siteToday(s.timezone||'Europe/London');
      var ts=tasks.filter(function(t){ return t.site_id===s.id && (!r.aud || (t.audience||'team')===r.aud); });
      var sum=summarise(ts, map, r.from, r.to, today);
      sum.site=s; return sum;
    });
    r.result={ perSite:perSite, comps:data.comps, signoffs:data.signoffs, secName:secName, secOrder:secOrder, from:r.from, to:r.to, tasks:tasks };
  }catch(e){ r.error=friendly(e); }
  r.busy=false; render();
}
function rate(done, due, excused){ return pct(done, due-excused); }
/* Task-by-day grid: tasks down the side, dates across the top. */
var MATRIX_MARK = { done:['✓','Done','m-done'], excused:['–','Not needed','m-excused'], missed:['✕','Missed','m-missed'], outstanding:['!','Not done yet (carries over)','m-out'], open:['○','Due, not done yet','m-open'], inperiod:['·','Any day this week/month','m-period'] };
function matrixTable(R){
  var dates=[]; for(var d=R.from; d<=R.to; d=Sched.addDays(d,1)) dates.push(d);
  var head=['Site','Section','Task'].concat(dates.map(fmtDate));
  var csv=[], body='';
  R.perSite.forEach(function(p){
    var tz=p.site.timezone||'Europe/London';
    var byTask={}, order=[];
    p.items.forEach(function(it){
      var e=byTask[it.task.id]; if(!e){ e=byTask[it.task.id]={task:it.task, cells:{}}; order.push(e); }
      if(Sched.isPeriod(it.task)){
        var end=Sched.periodEnd(it.task, it.key), doneDay = it.comp ? Sched.siteToday(tz, new Date(it.comp.completed_at)) : null;
        for(var x=it.key; x<=end; x=Sched.addDays(x,1)) e.cells[x]='inperiod';
        if(it.comp){ var cd = doneDay && doneDay>=it.key && doneDay<=end ? doneDay : end; e.cells[cd]=it.status; }
        else e.cells[end]=it.status;
      } else e.cells[it.key]=it.status;
    });
    if(!order.length) return;
    order.sort(function(a,b){ return ((R.secOrder[a.task.section_id]||0)-(R.secOrder[b.task.section_id]||0)) || byOrder(a.task,b.task); });
    if(R.perSite.length>1) body+='<tr class="group-row"><td class="mx-sticky" colspan="1"><strong>'+esc(p.site.name)+'</strong></td><td colspan="'+dates.length+'"></td></tr>';
    var lastSec=null;
    order.forEach(function(e){
      var sec=R.secName[e.task.section_id]||'';
      if(sec!==lastSec){ lastSec=sec; body+='<tr class="mx-sec"><td class="mx-sticky">'+esc(sec)+'</td><td colspan="'+dates.length+'"></td></tr>'; }
      body+='<tr><td class="mx-sticky mx-task">'+esc(e.task.title)+(e.task.audience==='management'?' <span class="status-pill mgmt-pill">Mgmt</span>':'')+'</td>'+
        dates.map(function(d){ var st=e.cells[d]; if(!st) return '<td class="mx-cell"></td>'; var mk=MATRIX_MARK[st]; return '<td class="mx-cell '+mk[2]+'" title="'+esc(e.task.title+' · '+fmtDate(d)+' · '+mk[1])+'">'+mk[0]+'</td>'; }).join('')+'</tr>';
      csv.push([p.site.name, sec, e.task.title].concat(dates.map(function(d){ var st=e.cells[d]; return st ? MATRIX_MARK[st][1] : ''; })));
    });
  });
  var dateHead = dates.map(function(d){ var wd=Sched.weekday(d); return '<th class="mx-date'+(wd>=6?' wkend':'')+'"><span>'+DOW[wd-1].charAt(0)+'</span>'+parseInt(d.slice(8),10)+(d.slice(8)==='01'||d===R.from?'<em>'+MONTHS[parseInt(d.slice(5,7),10)-1].slice(0,3)+'</em>':'')+'</th>'; }).join('');
  var legend='<div class="mx-legend">'+['done','excused','missed','outstanding','open','inperiod'].map(function(k){ var m=MATRIX_MARK[k]; return '<span><i class="mx-cell '+m[2]+'">'+m[0]+'</i> '+m[1]+'</span>'; }).join('')+'<span><i class="mx-cell"></i> Not due</span></div>';
  var html = body ? legend+'<table class="matrix"><thead><tr><th class="mx-sticky">Task</th>'+dateHead+'</tr></thead><tbody>'+body+'</tbody></table>' : '<div class="empty-row">Nothing was due in this range.</div>';
  return { head:head, rows:csv, html:html };
}
function reportTable(tab, R){
  if(tab==='matrix') return matrixTable(R);
  var head=[], rows=[];
  var siteName=function(id){ var s=siteById(id); return s?s.name:''; };
  if(tab==='site'){
    head=['Site','Due','Done','Not needed','Missed','Still outstanding','Not yet due','Done %','Days signed off'];
    R.perSite.forEach(function(p){
      var so=R.signoffs.filter(function(x){ return x.site_id===p.site.id; }).length;
      rows.push([p.site.name, p.due, p.done, p.excused, p.missed, p.outstanding, p.open, rate(p.done,p.due-p.open,p.excused), so]);
    });
  } else if(tab==='day'){
    head=['Date','Site','Due','Done','Not needed','Missed / outstanding','Done %','Signed off by'];
    R.perSite.forEach(function(p){
      var byDay={};
      p.items.forEach(function(it){
        var d = Sched.isPeriod(it.task) ? Sched.periodEnd(it.task,it.key) : it.key;
        if(d > R.to) d = R.to;
        var o=byDay[d]=byDay[d]||{due:0,done:0,excused:0,missed:0,open:0};
        o.due++; if(it.status==='done') o.done++; else if(it.status==='excused') o.excused++; else if(it.status==='open') o.open++; else o.missed++;
      });
      Object.keys(byDay).sort().forEach(function(d){
        var o=byDay[d], so=R.signoffs.find(function(x){ return x.site_id===p.site.id && x.day===d; });
        rows.push([fmtDate(d), p.site.name, o.due, o.done, o.excused, o.missed, rate(o.done, o.due-o.open, o.excused), so?so.signed_by_name:'']);
      });
    });
    rows.sort(function(a,b){ var da=a[0].split('/').reverse().join(''), db=b[0].split('/').reverse().join(''); return da<db?-1:da>db?1:a[1].localeCompare(b[1]); });
  } else if(tab==='task'){
    head=['Site','Section','Task','Type','Schedule','Due','Done','Not needed','Missed / outstanding','Done %','Last done'];
    R.perSite.forEach(function(p){
      var byTask={};
      p.items.forEach(function(it){
        var o=byTask[it.task.id]=byTask[it.task.id]||{task:it.task, due:0, done:0, excused:0, missed:0, open:0, last:''};
        o.due++; if(it.status==='done'){ o.done++; if(it.key>o.last) o.last=it.key; } else if(it.status==='excused') o.excused++; else if(it.status==='open') o.open++; else o.missed++;
      });
      Object.keys(byTask).map(function(k){ return byTask[k]; }).sort(function(a,b){ return (R.secName[a.task.section_id]||'').localeCompare(R.secName[b.task.section_id]||'') || a.task.title.localeCompare(b.task.title); }).forEach(function(o){
        rows.push([p.site.name, R.secName[o.task.section_id]||'', o.task.title, o.task.audience==='management'?'Management':'Team', scheduleText(o.task), o.due, o.done, o.excused, o.missed, rate(o.done, o.due-o.open, o.excused), o.last?fmtDate(o.last):'—']);
      });
    });
  } else if(tab==='person'){
    head=['Name','Site','Tasks done','Marked not needed','Last done'];
    var by={};
    R.comps.forEach(function(c){
      if(c.occurrence_date < Sched.addDays(R.from,-31)) return;
      var day=Sched.siteToday('Europe/London', new Date(c.completed_at));
      if(day<R.from || day>R.to) return;
      var k=(c.completed_by_name||'Unknown')+'|'+c.site_id;
      var o=by[k]=by[k]||{name:c.completed_by_name||'Unknown', site:c.site_id, done:0, excused:0, last:''};
      if(c.status==='excused') o.excused++; else o.done++;
      if(day>o.last) o.last=day;
    });
    Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return b.done-a.done || a.name.localeCompare(b.name); }).forEach(function(o){ rows.push([o.name, siteName(o.site), o.done, o.excused, fmtDate(o.last)]); });
  } else if(tab==='missed'){
    head=['Date','Site','Section','Task','Type','Status','If not done'];
    R.perSite.forEach(function(p){
      p.items.filter(function(it){ return it.status==='missed' || it.status==='outstanding'; }).forEach(function(it){
        rows.push([Sched.isPeriod(it.task)?'By '+fmtDate(Sched.periodEnd(it.task,it.key)):fmtDate(it.key), p.site.name, R.secName[it.task.section_id]||'', it.task.title, it.task.audience==='management'?'Management':'Team', it.status==='missed'?'Missed':'Still outstanding', it.task.if_missed==='carry'?'Carries over':'Marked missed']);
      });
    });
    rows.sort(function(a,b){ return a[0].replace('By ','').split('/').reverse().join('') < b[0].replace('By ','').split('/').reverse().join('') ? 1 : -1; });
  }
  var pctCol = head.indexOf('Done %');
  var html='<table><thead><tr>'+head.map(function(h,i){ return '<th'+(i>1&&typeof (rows[0]||[])[i]==='number'?' class="num"':'')+'>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    (rows.length ? rows.slice(0,2000).map(function(r){ return '<tr>'+r.map(function(v,i){
      if(i===pctCol) return '<td class="num"><span class="pct-cell '+pctClass(v)+'">'+(v===null?'—':v+'%')+'</span></td>';
      return '<td'+(typeof v==='number'?' class="num"':'')+'>'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('') : '<tr><td colspan="'+head.length+'"><div class="empty-row">Nothing to show for this range.</div></td></tr>')+
    '</tbody></table>'+(rows.length>2000?'<div class="empty-row">Showing the first 2,000 rows — download the CSV for all '+rows.length+'.</div>':'');
  return { head:head, rows:rows.map(function(r){ return r.map(function(v,i){ return i===pctCol ? (v===null?'':v+'%') : v; }); }), html:html };
}
function downloadCsv(name, head, rows){
  var q=function(v){ v=(v===null||v===undefined)?'':String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var csv='﻿'+[head].concat(rows).map(function(r){ return r.map(q).join(','); }).join('\r\n');
  return saveFile(name, csv, 'text/csv;charset=utf-8');
}
/* Saves a file for the person. Inside a host that offers a save dialog,
   that is used; otherwise a normal browser download. */
async function saveFile(name, text, mime){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      var dl = await window.claude.use('downloads');
      if(dl){
        try{ await dl.save({filename:name, data:text}); return true; }
        catch(e){ if(e && e.code==='declined') return false; if(e && e.code==='rate_limited'){ toast('A save is already waiting for you.'); return false; } }
      }
    }
  }catch(e){}
  var blob=new Blob([text], {type:mime||'application/octet-stream'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

/* ---------- Setup file: copy sites, tasks, roles etc. from one copy of the app to another ---------- */
async function buildSetupFile(){
  var sites=await fetchAll(function(){ return sb.from('sites').select('*').order('display_order').order('name').order('id'); });
  var out={ kind:'site-tasks-setup', version:1, created:new Date().toISOString(),
    settings:{ app_title:S.settings.app_title, history_days:S.settings.history_days, keep_months:S.settings.keep_months },
    roles:(S.roles||[]).map(function(r){ return {id:r.id, name:r.name, description:r.description||'', perms:r.perms, locked:r.locked, sort_order:r.sort_order}; }),
    library:(await fetchAll(function(){ return sb.from('library_tasks').select('*').order('title').order('id'); })).map(stripTask),
    sites:[] };
  for(var i=0;i<sites.length;i++){
    var s=sites[i], base=await loadSiteBase(s.id, true);
    var sec={}; base.sections.forEach(function(x){ sec[x.id]=x.name; });
    var ar={}; (base.areas||[]).forEach(function(x){ ar[x.id]=x.name; });
    out.sites.push({ name:s.name, brand:s.brand||'', address:s.address||'', display_order:s.display_order, who_mode:s.who_mode, active:s.active,
      sections:base.sections.slice().sort(byOrder).map(function(x){ return {name:x.name, sort_order:x.sort_order}; }),
      areas:(base.areas||[]).slice().sort(byOrder).map(function(x){ return {name:x.name, sort_order:x.sort_order}; }),
      staff:base.staff.map(function(x){ return {name:x.name, active:x.active}; }),
      tasks:base.tasks.slice().sort(byOrder).map(function(t){ var o=stripTask(t); o.section_name=sec[t.section_id]||''; o.area_name=ar[t.area_id]||''; return o; }) });
  }
  return out;
}
function stripTask(t){
  var keep=['title','instructions','checklist','audience','section_name','area_name','schedule_type','start_date','end_date','interval_n','weekdays','month_day','nth','nth_weekday','due_time','if_missed','sort_order','active'];
  var o={}; keep.forEach(function(k){ if(t[k]!==undefined) o[k]=t[k]; }); return o;
}
function summariseSetup(f){
  var n=0; (f.sites||[]).forEach(function(s){ n+=(s.tasks||[]).length; });
  return plural((f.sites||[]).length,'site')+', '+plural(n,'task')+', '+plural((f.library||[]).length,'library task')+' and '+plural((f.roles||[]).length,'role');
}
/* Adds what's in the file. Things that already exist (same name) are kept, not duplicated. */
async function importSetup(f, progress){
  if(!f || f.kind!=='site-tasks-setup') throw new Error('That isn’t a setup file from this app.');
  var log={sites:0, tasks:0, library:0, roles:0, sections:0, areas:0, staff:0};
  if(f.settings) await writeRows(sb.from('app_settings').update({ app_title:f.settings.app_title||APP_DEFAULT_TITLE, history_days:f.settings.history_days||62, keep_months:(f.settings.keep_months!==undefined?f.settings.keep_months:13) }).eq('id', true));
  for(var i=0;i<(f.roles||[]).length;i++){
    var r=f.roles[i], ex=(S.roles||[]).find(function(x){ return x.id===r.id || x.name===r.name; });
    if(ex){ var patch={name:r.name, description:r.description||''}; if(!ex.locked) patch.perms=r.perms; await writeRows(sb.from('roles').update(patch).eq('id', ex.id)); }
    else { await one(sb.from('roles').insert({name:r.name, description:r.description||'', perms:r.perms||[], sort_order:r.sort_order||0})); log.roles++; }
  }
  await loadMe();
  var lib=await fetchAll(function(){ return sb.from('library_tasks').select('title').order('id'); }), libHas={};
  lib.forEach(function(x){ libHas[x.title.toLowerCase()]=1; });
  var newLib=(f.library||[]).filter(function(t){ return !libHas[(t.title||'').toLowerCase()]; }).map(function(t){ var o=stripTask(t); delete o.start_date; delete o.end_date; delete o.sort_order; delete o.active; return o; });
  for(var c=0;c<newLib.length;c+=200){ await one(sb.from('library_tasks').insert(newLib.slice(c,c+200))); }
  log.library=newLib.length;
  for(var j=0;j<(f.sites||[]).length;j++){
    var fs=f.sites[j]; if(progress) progress('Site '+(j+1)+' of '+f.sites.length+': '+fs.name);
    var site=S.sites.find(function(x){ return x.name.toLowerCase()===String(fs.name).toLowerCase(); });
    if(!site){ site=await one(sb.from('sites').insert({name:fs.name, brand:fs.brand||'', address:fs.address||'', display_order:fs.display_order||0, who_mode:fs.who_mode||'optional', active:fs.active!==false}).select('*').single()); log.sites++; await loadMe(); }
    var base=await loadSiteBase(site.id, true);
    for(var k=0;k<(fs.sections||[]).length;k++){ var x=fs.sections[k]; if(!base.sections.some(function(y){ return y.name.toLowerCase()===x.name.toLowerCase(); })){ await one(sb.from('sections').insert({site_id:site.id, name:x.name, sort_order:x.sort_order||0})); log.sections++; } }
    for(var k2=0;k2<(fs.areas||[]).length;k2++){ var a=fs.areas[k2]; if(!(base.areas||[]).some(function(y){ return y.name.toLowerCase()===a.name.toLowerCase(); })){ await one(sb.from('areas').insert({site_id:site.id, name:a.name, sort_order:a.sort_order||0})); log.areas++; } }
    var newStaff=(fs.staff||[]).filter(function(p){ return !base.staff.some(function(y){ return y.name.toLowerCase()===p.name.toLowerCase(); }); }).map(function(p){ return {site_id:site.id, name:p.name, active:p.active!==false}; });
    if(newStaff.length){ await one(sb.from('site_staff').insert(newStaff)); log.staff+=newStaff.length; }
    base=await loadSiteBase(site.id, true);
    var secBy={}, arBy={}; base.sections.forEach(function(y){ secBy[y.name.toLowerCase()]=y.id; }); (base.areas||[]).forEach(function(y){ arBy[y.name.toLowerCase()]=y.id; });
    var firstSec=base.sections.slice().sort(byOrder)[0];
    var have={}; base.tasks.forEach(function(t){ have[(t.title+'|'+t.section_id).toLowerCase()]=1; });
    var rows=(fs.tasks||[]).map(function(t){
      var o=stripTask(t), secId=secBy[(t.section_name||'').toLowerCase()]||(firstSec&&firstSec.id);
      delete o.section_name; delete o.area_name;
      o.site_id=site.id; o.section_id=secId; o.area_id=arBy[(t.area_name||'').toLowerCase()]||null;
      return o;
    }).filter(function(o){ return o.section_id && !have[(o.title+'|'+o.section_id).toLowerCase()]; });
    for(var c2=0;c2<rows.length;c2+=200){ await one(sb.from('tasks').insert(rows.slice(c2,c2+200))); }
    log.tasks+=rows.length;
  }
  return log;
}

   12. RENDER
   ============================================================ */
function render(toTop){
  var app=document.getElementById('app');
  var y = window.scrollY;
  var html;
  switch(S.view){
    case 'notconfigured': html=renderNotConfigured(); break;
    case 'boot': html='<div class="loading" style="min-height:100vh;"><div class="spinner"></div>Loading…</div>'; break;
    case 'login': html=renderLogin(); break;
    case 'changepin': html=renderChangePinScreen(); break;
    case 'day': html=renderDay(); break;
    case 'calendar': html=renderCalendar(); break;
    case 'admin': html=renderAdmin(); break;
    default: html=renderLanding();
  }
  // keep the focused search box usable while typing
  var active=document.activeElement, activeKey = active && active.getAttribute && active.getAttribute('data-a-input'), selStart = active && active.selectionStart;
  app.innerHTML=html;
  if(activeKey){ var again=app.querySelector('[data-a-input="'+activeKey+'"]'); if(again){ again.focus(); try{ again.setSelectionRange(selStart, selStart); }catch(e){} } }
  if(toTop) window.scrollTo(0,0); else if(window.scrollY!==y) window.scrollTo(0,y);
  if(!S.me && (S.view==='login' || S.view==='landing')){ var u=document.getElementById(S.login.username?'lgPin':'lgUser'); if(u && !S.login.busy && document.activeElement===document.body) u.focus(); }
}
function renderModal(){
  var root=document.getElementById('modal');
  var m=S.modal;
  root.innerHTML = m && MODALS[m.type] ? MODALS[m.type](m) : '';
  document.body.style.overflow = m ? 'hidden' : '';
  if(m && !m.noFocus){
    var first=root.querySelector('input:not([disabled]):not([type=checkbox]), textarea, select');
    if(first && !m.focused && window.innerWidth>700){ first.focus(); m.focused=true; }
  }
}

function updateUrl(){
  try{
    var u=new URL(window.location.href);
    u.searchParams.delete('location');
    if(S.deepSiteId) u.searchParams.set('site', S.deepSiteId);
    window.history.replaceState(null, '', u.toString());
  }catch(e){}
}

async function busyModal(fn){
  var m=S.modal; if(!m || m.busy) return;
  m.busy=true; m.error=''; renderModal();
  try{ await fn(m); if(S.modal===m){ m.busy=false; } }
  catch(e){ console.warn('Not saved: '+safeErrText(e)); if(S.modal===m){ m.busy=false; m.error=friendly(e); renderModal(); } }
}

/* Moves item i to position j and renumbers the whole list. */
async function reorder(list, i, j, table, col){
  col=col||'sort_order';
  var arr=list.slice(); var it=arr.splice(i,1)[0]; arr.splice(j,0,it);
  var jobs=[];
  arr.forEach(function(x, idx){ if((x[col]||0)!==idx+1){ var patch={}; patch[col]=idx+1; jobs.push(sb.from(table).update(patch).eq('id', x.id).select('id')); } });
  var res=await Promise.all(jobs);
  res.forEach(function(r){ if(r.error) throw r.error; });
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); ta.remove(); return ok; }catch(_){ return false; }
  }
}

async function bulkAction(op){
  var ids=Object.keys(S.admin.selected).filter(function(id){ return S.admin.selected[id]; });
  if(!ids.length) return;
  var base=S.cache[S.admin.siteId];
  var sel=base.tasks.filter(function(t){ return ids.indexOf(t.id)!==-1; });
  if(op==='section') return openModal({type:'bulkSection', ids:ids});
  if(op==='copy') return openModal({type:'bulkCopy', ids:ids});
  if(op==='pause' || op==='resume'){
    return adminWrite(async function(){ for(var c=0;c<ids.length;c+=100){ await writeRows(sb.from('tasks').update({active:op==='resume'}).in('id', ids.slice(c,c+100))); } await loadSiteBase(S.admin.siteId, true); S.admin.selected={}; }, plural(ids.length,'task')+(op==='pause'?' paused':' resumed'));
  }
  if(op==='library'){
    var secName={}; base.sections.forEach(function(s){ secName[s.id]=s.name; });
    return adminWrite(async function(){
      var arName={}; (base.areas||[]).forEach(function(a){ arName[a.id]=a.name; });
      var rows=sel.map(function(t){ return { title:t.title, instructions:t.instructions, checklist:(t.checklist||[]).slice(), section_name:secName[t.section_id]||'', area_name:arName[t.area_id]||'', audience:t.audience||'team', schedule_type:t.schedule_type, interval_n:t.interval_n, weekdays:t.weekdays, month_day:t.month_day, nth:t.nth, nth_weekday:t.nth_weekday, due_time:t.due_time, if_missed:t.if_missed }; });
      for(var c=0;c<rows.length;c+=200) await one(sb.from('library_tasks').insert(rows.slice(c,c+200)));
      S.admin.selected={};
    }, plural(ids.length,'task')+' saved to the library');
  }
  if(op==='delete'){
    return confirmAction('Permanently delete '+plural(ids.length,'task')+'? Their ticks and assignments are deleted too (the history log keeps a record). To keep them, pause them instead.', 'Delete '+plural(ids.length,'task'), async function(){

      S.admin.selected={}; await loadSiteBase(S.admin.siteId, true); render(); toast(plural(ids.length,'task')+' deleted');
    }, true);
  }
}

    busyModal(async function(m){
      var targets=v.sites||[]; if(!targets.length) throw new Error('Tick at least one site.');
      var base=S.cache[S.admin.siteId], secName={}; base.sections.forEach(function(s){ secName[s.id]=s.name; });
      var arName={}; (base.areas||[]).forEach(function(a){ arName[a.id]=a.name; });
      var src=base.tasks.filter(function(t){ return m.ids.indexOf(t.id)!==-1; }).map(function(t){ return Object.assign({}, t, {_section_name:secName[t.section_id]||'', _area_name:arName[t.area_id]||''}); });
      for(var i=0;i<targets.length;i++){
        var tb=await loadSiteBase(targets[i], true), secs=tb.sections.slice().sort(byOrder);
        if(!secs.length) continue;
        var rows=copyRowsToSite(src, targets[i], secs, secs[0].id);
        for(var c=0;c<rows.length;c+=200) await one(sb.from('tasks').insert(rows.slice(c,c+200)));
      }
      S.admin.selected={}; closeModal(); render(); toast('Copied to '+plural(targets.length,'site'));
    });
  },
  site: function(v){
    busyModal(async function(m){
      var row={ name:(v.name||'').trim(), brand:(v.brand||'').trim(), address:(v.address||'').trim(), who_mode:v.who_mode };
      if(!row.name) throw new Error('Please enter a site name.');
      if(m.id) await writeRows(sb.from('sites').update(row).eq('id', m.id));
      else { row.display_order = S.sites.filter(function(s){ return (s.brand||'')===row.brand; }).reduce(function(mx,s){ return Math.max(mx, s.display_order||0); },0)+1; await one(sb.from('sites').insert(row)); }
      await loadMe(); closeModal(); render(); toast(m.id?'Saved':'Site added');
    });
  },
  login2: function(v){
    syncModalForm();
    busyModal(async function(m){
      var f=m.form, self=m.id && m.id===S.me.id;
      var r = self ? S.me.role : (v.role||f.role);
      var allSites = (roleById(r)||{perms:[]}).perms.indexOf('all_sites')!==-1;
      var sites = allSites ? [] : (v.sites||[]);
      if(!(v.display_name||'').trim()) throw new Error('Please enter a display name.');
      if(!allSites && !sites.length) throw new Error('Tick at least one site.');
      if(m.id){
        await rpc('admin_update_user', {p_id:m.id, p_display_name:v.display_name.trim(), p_role:r, p_active: self ? true : !!v.active, p_site_ids:sites});
        await loadLogins(); if(self) await loadMe(); closeModal(); render(); toast('Saved');
      } else {
        var u=(v.username||'').trim().toLowerCase(), pin=(v.pin||'').trim();
        await rpc('admin_create_user', {p_username:u, p_pin:pin, p_display_name:v.display_name.trim(), p_role:r, p_site_ids:sites, p_force_change:!!v.force});
        await loadLogins(); render();
        openModal({type:'loginCreated', username:u, pin:pin, name:v.display_name.trim(), force:!!v.force});
      }
    });
  },
  resetPin: function(v){
    busyModal(async function(m){
      var pin=(v.pin||'').trim();
      await rpc('admin_set_pin', {p_id:m.profile.id, p_pin:pin, p_force_change:!!v.force});
      m.pin=pin; m.doneMsg = v.force ? 'They’ll be asked to choose their own PIN next time they log in.' : 'This PIN stays until someone changes it.';
      await loadLogins(); render(); renderModal();
    });
  },
  role: function(v){
    busyModal(async function(m){
      var name=(v.name||'').trim(); if(!name) throw new Error('Please enter a role name.');
      var row={ name:name, description:(v.description||'').trim() };
      if(!m.locked) row.perms = v.perms||[];
      if(m.id) await writeRows(sb.from('roles').update(row).eq('id', m.id));
      else { row.sort_order=(S.roles||[]).reduce(function(mx,r){ return Math.max(mx, r.sort_order||0); },0)+1; await one(sb.from('roles').insert(row)); }
      await loadMe(); closeModal(); render(); toast('Saved');
    });
  },
  appSettings: function(v){
    adminWrite(async function(){
      var keep=parseInt(v.keep_months,10); if([0,3,6,12,13,18,24,36].indexOf(keep)===-1) keep=13;
      var days=parseInt(v.history_days,10); if(!(days>=7 && days<=400)) throw new Error('Please choose between 7 and 400 days.');
      var title=(v.app_title||'').trim()||APP_DEFAULT_TITLE;
      await writeRows(sb.from('app_settings').update({app_title:title, history_days:days, keep_months:keep, updated_at:new Date().toISOString()}).eq('id', true));
      S.settings.app_title=title; S.settings.history_days=days; S.settings.keep_months=keep; document.title=title;
    }, 'Settings saved');
  }
};

document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-a]'); if(!el) return;
  var a=ds(el,'a');
  if(a==='overlay' && ev.target!==el) return;
  if(el.tagName==='INPUT' && el.type==='checkbox'){ if(ACTIONS[a]) ACTIONS[a](el, ev); return; }
  ev.preventDefault();
  if(ACTIONS[a]) ACTIONS[a](el, ev);
});
document.addEventListener('change', function(ev){ var el=ev.target.closest('[data-a-change]'); if(el && CHANGES[ds(el,'a-change')]) CHANGES[ds(el,'a-change')](el, ev); });
document.addEventListener('input', function(ev){ var el=ev.target.closest('[data-a-input]'); if(el && INPUTS[ds(el,'a-input')]) INPUTS[ds(el,'a-input')](el, ev); });
document.addEventListener('submit', function(ev){
  var f=ev.target.closest('form[data-form]'); if(!f) return;
  ev.preventDefault();
  var name=ds(f,'form'); if(!FORMS[name]) return;
  if(S.modal && f.closest('#modal')) syncNamedInputs();
  FORMS[name](readForm(f));
});
document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && S.modal){ closeModal(); } });

/* ============================================================
   14. START UP
   ============================================================ */
async function boot(){
  try{
    var q=new URLSearchParams(window.location.search);
    S.deepSiteId = q.get('site') || q.get('location') || null;
  }catch(e){}
  if(NOT_CONFIGURED || !sb){ S.view='notconfigured'; return render(); }
  render();
  try{
    await loadPublic();
    var me = await loadMe();
    if(me && !me.active){ await sb.auth.signOut(); S.me=null; }
    if(S.me){
      if(S.me.must_change_pin){ S.view='changepin'; return render(); }
      return afterLogin();
    }
    S.view='landing';
    render();
  }catch(e){
    console.error('Start-up failed: '+safeErrText(e));
    document.getElementById('app').innerHTML='<div class="login-shell"><div class="login-card"><div class="brand-mark">'+BRAND_SVG+'</div><h1>Can’t load right now</h1><p>'+esc(friendly(e))+'</p><button class="btn btn-primary btn-block" onclick="location.reload()">Try again</button></div></div>';
  }
}

/* Keep shared tablets fresh: pick up other tablets' ticks, and roll over at midnight. */
setInterval(function(){
  if(document.hidden || S.modal || !S.me) return;
  if(S.view==='day' && S.day.loadedFor){
    var today=todayFor(S.siteId);
    if(S.dayWasToday && S.date!==today && S.dayWasToday===S.date){ S.date=today; S.day.loadedFor=''; render(); }
    S.dayWasToday = S.date===today ? S.date : null;
    if(!Object.keys(S.pending).length) reloadDay(true);
  }
}, AUTO_REFRESH_SECONDS*1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.view==='day' && S.me && !S.modal && S.day.loadedFor) reloadDay(true); });
if(sb){
  sb.auth.onAuthStateChange(function(event){
    if(event==='SIGNED_OUT' && S.me){ S.me=null; S.view = 'landing'; render(true); }
  });
}

boot();

})();
</script>
