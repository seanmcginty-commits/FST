<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Site Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS (same visual language as the Allergen Guide)
   ============================================================ */
:root{
  --teal-900:#0a3d40; --teal-800:#0f5257; --teal-700:#146a70; --teal-100:#e3f2f1;
  --amber-500:#f2a93b; --amber-600:#e0921c; --amber-700:#a8660a; --amber-100:#fdf1dd;
  --coral-600:#d94f4f; --coral-700:#b83a3a; --coral-100:#fbe6e6;
  --ink-900:#132224; --ink-700:#3c5457; --ink-500:#6b8386;
  --paper-0:#ffffff; --paper-50:#f7faf9; --paper-100:#eef4f3;
  --line:#dde8e7;
  --ok-600:#2f8f5b; --ok-700:#23714a; --ok-100:#e5f5ec;
  --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
  --shadow-card:0 2px 10px rgba(10,61,64,.07), 0 1px 2px rgba(10,61,64,.06);
  --shadow-pop:0 12px 32px rgba(10,61,64,.18);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font-body); background:var(--paper-50); color:var(--ink-900); -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--teal-900); line-height:1.15;}
p{margin:0;}
button{font-family:inherit; cursor:pointer; touch-action:manipulation;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:3px solid var(--amber-500); outline-offset:2px;}
[hidden]{display:none !important;}

/* The page itself scrolls (never an inner box) so tablets and Teams scroll naturally. */
#app{min-height:100vh; display:flex; flex-direction:column;}
main{flex:1; width:100%;}
.wrap{max-width:1080px; margin:0 auto; padding:18px 16px 90px;}
.wrap-narrow{max-width:760px; margin:0 auto; padding:18px 16px 90px;}

/* ---------- Top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--teal-900); color:#fff; position:sticky; top:0; z-index:40; min-height:64px;}
.brand{display:flex; cursor:pointer;} .topbar .brand, .admin-sidebar .brand{display:flex; align-items:center; gap:10px; background:none; border:none; color:#fff; padding:4px; min-width:0; text-align:left;}
.brand-mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(155deg, var(--amber-500), var(--coral-600)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.brand-text{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-text small{display:block; font-family:var(--font-body); font-weight:500; font-size:11px; opacity:.75; letter-spacing:.4px; text-transform:uppercase; margin-top:1px; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff; min-width:44px; height:44px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; padding:0 10px; gap:6px; font-weight:600;}
.icon-btn:hover{background:rgba(255,255,255,.22);}
.icon-btn .lbl{font-size:13.5px;}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-shrink:0;}
.back-pill{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff; border-radius:999px; padding:10px 14px 10px 12px; font-size:14px; font-weight:600; flex-shrink:0;}
.topbar-title{min-width:0; flex:1; color:#fff;}
.topbar-title h1{color:#fff; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar-title .sub{font-size:12px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------- Landing ---------- */
.hero{background:radial-gradient(circle at 15% 0%, var(--teal-700), var(--teal-900) 65%); color:#fff; padding:40px 18px 38px; text-align:center; position:relative; overflow:hidden;}
.hero::after{content:""; position:absolute; right:-60px; bottom:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(242,169,59,.35), transparent 70%); pointer-events:none;}
.hero h1{color:#fff; font-size:clamp(26px,6vw,38px); font-weight:700; margin-bottom:8px; position:relative;}
.hero p{color:rgba(255,255,255,.85); font-size:15.5px; max-width:520px; margin:0 auto; position:relative;}
.hero .eyebrow{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; margin-bottom:16px; position:relative;}
.location-area{max-width:1080px; margin:0 auto; padding:26px 16px 10px;}
.brand-section + .brand-section{margin-top:30px;}
.brand-group-heading{font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-500); margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);}
.location-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px;}
.location-card{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 18px; box-shadow:var(--shadow-card); text-align:left; display:flex; align-items:center; gap:14px; transition:transform .15s ease, box-shadow .15s ease; width:100%;}
.location-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-pop);}
.location-glyph{width:52px; height:52px; border-radius:14px; flex-shrink:0; background:linear-gradient(155deg, var(--teal-700), var(--teal-900)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; font-family:var(--font-display);}
.location-card h3{font-size:18px; margin-bottom:3px;}
.location-card span{font-size:13px; color:var(--ink-500);}
.empty-note{text-align:center; padding:40px 20px; color:var(--ink-500); font-size:14.5px; line-height:1.5;}
.signed-strip{max-width:1080px; margin:0 auto; padding:14px 16px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; font-size:13.5px; color:var(--ink-700);}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:12px; padding:12px 18px; font-size:14px; font-weight:700; transition:transform .1s ease, opacity .15s ease; min-height:44px; text-decoration:none;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-900); color:#fff;}
.btn-primary:hover{background:var(--teal-800);}
.btn-amber{background:var(--amber-500); color:var(--ink-900);}
.btn-amber:hover{background:var(--amber-600);}
.btn-ghost{background:var(--paper-100); color:var(--teal-900);}
.btn-danger{background:var(--coral-100); color:var(--coral-700);}
.btn-danger-solid{background:var(--coral-600); color:#fff;}
.btn-outline{background:var(--paper-0); border:1.5px solid var(--line); color:var(--ink-900);}
.btn-ok{background:var(--ok-600); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px; font-size:12.5px; border-radius:9px; min-height:36px;}
.btn[disabled]{opacity:.45; pointer-events:none;}

/* ---------- Day screen ---------- */
.datebar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.datebar .date-label{flex:1; min-width:180px; text-align:center; background:var(--paper-0); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-weight:700; font-size:15px; color:var(--teal-900);}
.datebar .date-label small{display:block; font-weight:600; font-size:11.5px; color:var(--ink-500); text-transform:uppercase; letter-spacing:.4px;}
.nav-btn{background:var(--paper-0); border:1.5px solid var(--line); border-radius:12px; min-width:48px; height:48px; font-size:18px; font-weight:700; color:var(--teal-900); display:inline-flex; align-items:center; justify-content:center; padding:0 12px; gap:6px;}
.nav-btn .lbl{font-size:13.5px;}
.mode-banner{border-radius:var(--radius-md); padding:12px 14px; font-size:13.5px; font-weight:600; margin-bottom:14px; line-height:1.45;}
.mode-banner.past{background:var(--paper-100); color:var(--ink-700); border:1px solid var(--line);}
.mode-banner.future{background:var(--teal-100); color:var(--teal-900); border:1px solid #c7dedb;}

.overdue-alert{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--coral-600); color:#fff; border:none; border-radius:var(--radius-md); padding:14px 16px; margin-bottom:14px; box-shadow:0 6px 18px rgba(217,79,79,.28);}
.overdue-alert .big{font-size:26px; line-height:1;}
.overdue-alert strong{display:block; font-size:16px;}
.overdue-alert span{font-size:13px; opacity:.92;}

.summary-card{display:flex; align-items:center; gap:18px; background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow-card); margin-bottom:14px; flex-wrap:wrap;}
.ring{position:relative; width:84px; height:84px; flex-shrink:0;}
.ring svg{display:block; transform:rotate(-90deg);}
.ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:22px; color:var(--teal-900);}
.summary-main{flex:1; min-width:170px;}
.summary-main h2{font-size:21px;}
.summary-main .sub{font-size:13.5px; color:var(--ink-700); margin-top:3px; line-height:1.5;}
.summary-actions{display:flex; gap:8px; flex-wrap:wrap;}
.chip-stat{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; margin:6px 6px 0 0;}
.chip-stat.late{background:var(--amber-100); color:var(--amber-700);}
.chip-stat.red{background:var(--coral-100); color:var(--coral-700);}
.chip-stat.ok{background:var(--ok-100); color:var(--ok-700);}
.chip-stat.grey{background:var(--paper-100); color:var(--ink-700);}

.who-bar{display:flex; align-items:center; gap:10px; background:var(--amber-100); border:1px solid #f1d9aa; border-radius:var(--radius-md); padding:10px 12px; margin-bottom:16px; flex-wrap:wrap;}
.who-bar .who-label{flex:1; min-width:160px; font-size:14px; color:var(--ink-900);}
.who-bar .who-label strong{font-size:15px;}

.section-block{margin-bottom:18px;}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px 8px; position:sticky; top:64px; background:var(--paper-50); z-index:5;}
.section-head h2{font-size:18px; border-left:4px solid var(--amber-500); padding-left:10px;}
.section-head.overdue h2{border-left-color:var(--coral-600); color:var(--coral-700);}
.count-pill{font-size:12.5px; font-weight:700; background:var(--paper-0); border:1px solid var(--line); color:var(--ink-700); padding:4px 10px; border-radius:999px; white-space:nowrap;}
.count-pill.done{background:var(--ok-100); border-color:#bfe3cd; color:var(--ok-700);}
.task-list{display:flex; flex-direction:column; gap:8px;}
.task-row{display:flex; align-items:flex-start; gap:12px; background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 12px; box-shadow:var(--shadow-card);}
.task-row.is-done{background:#fbfefc; border-color:#cfe9da;}
.task-row.is-done .task-title{color:var(--ink-500); text-decoration:line-through; text-decoration-color:rgba(107,131,134,.5);}
.task-row.is-missed{border-color:#f2c2c2; background:#fffafa;}
.task-row.is-overdue{border-color:#f2c2c2; border-left:5px solid var(--coral-600);}
.task-row.is-excused{background:var(--paper-100);}
.tick{width:48px; height:48px; border-radius:50%; border:2.5px solid #b9cfcd; background:var(--paper-0); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; transition:background .12s, border-color .12s, transform .1s;}
.tick:active{transform:scale(.92);}
.tick.done{background:var(--ok-600); border-color:var(--ok-600);}
.tick.excused{background:var(--ink-500); border-color:var(--ink-500); font-size:18px;}
.tick.missed{background:var(--coral-100); border-color:#f2c2c2; color:var(--coral-600); font-size:20px;}
.tick.pending{opacity:.6;}
.tick.readonly{cursor:default; border-style:dashed;}
.tick.locked{background:var(--paper-100);}
.task-body{flex:1; min-width:0; padding-top:2px;}
.task-title{font-weight:700; font-size:15.5px; line-height:1.35; word-wrap:break-word;}
.task-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.meta{font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--paper-100); color:var(--ink-700); line-height:1.4;}
.meta.time{background:var(--teal-100); color:var(--teal-800);}
.meta.late{background:var(--coral-100); color:var(--coral-700);}
.meta.assign{background:#ece8fb; color:#4b3c99;}
.meta.done{background:var(--ok-100); color:var(--ok-700);}
.meta.missed{background:var(--coral-100); color:var(--coral-700);}
.meta.carry{background:var(--amber-100); color:var(--amber-700);}
.meta.period{background:#e6f0f5; color:#2b5f7a;}
.task-note{font-size:12.5px; color:var(--ink-700); margin-top:6px; background:var(--paper-50); border-radius:8px; padding:6px 9px; border:1px solid var(--line);}
.task-side{display:flex; gap:6px; flex-shrink:0;}
.round-btn{width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper-0); color:var(--teal-800); font-size:17px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; font-family:Georgia, serif;}
.round-btn.more{font-family:var(--font-body); font-size:20px; letter-spacing:1px;}
.signed-off-box{background:var(--ok-100); border:1px solid #bfe3cd; color:var(--ok-700); border-radius:var(--radius-md); padding:12px 14px; font-size:13.5px; font-weight:600; margin-bottom:14px;}

/* ---------- Calendar ---------- */
.cal-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.cal-toolbar h2{flex:1; font-size:21px; min-width:150px;}
.seg{display:inline-flex; background:var(--paper-100); border-radius:999px; padding:4px;}
.seg button{border:none; background:transparent; padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:700; color:var(--ink-700); min-height:40px;}
.seg button.active{background:var(--teal-900); color:#fff;}
.cal-grid{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px;}
.cal-dow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-500); text-align:center; padding:4px 0;}
.cal-cell{background:var(--paper-0); border:1px solid var(--line); border-radius:12px; min-height:84px; padding:7px; text-align:left; display:flex; flex-direction:column; gap:4px; width:100%;}
.cal-cell.other{opacity:.45;}
.cal-cell.today{border:2px solid var(--teal-700);}
.cal-cell .dnum{font-weight:800; font-size:14px; color:var(--teal-900); display:flex; justify-content:space-between; align-items:center;}
.cal-cell .dpct{font-size:12.5px; font-weight:800; border-radius:8px; padding:3px 6px; text-align:center;}
.dpct.g{background:var(--ok-100); color:var(--ok-700);}
.dpct.a{background:var(--amber-100); color:var(--amber-700);}
.dpct.r{background:var(--coral-100); color:var(--coral-700);}
.dpct.f{background:var(--paper-100); color:var(--ink-700);}
.cal-cell .dsub{font-size:11px; color:var(--ink-500); line-height:1.3;}
.week-list{display:flex; flex-direction:column; gap:8px;}
.week-row{display:flex; align-items:center; gap:14px; background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; text-align:left; width:100%;}
.week-row.today{border:2px solid var(--teal-700);}
.week-row .wd{width:110px; flex-shrink:0;}
.week-row .wd strong{display:block; font-size:15px; color:var(--teal-900);}
.week-row .wd span{font-size:12px; color:var(--ink-500);}
.bar{flex:1; height:10px; background:var(--paper-100); border-radius:999px; overflow:hidden; min-width:60px;}
.bar > i{display:block; height:100%; background:var(--ok-600); border-radius:999px;}
.week-row .wstats{font-size:12.5px; color:var(--ink-700); width:170px; text-align:right; flex-shrink:0;}
@media (max-width:600px){
  .cal-cell{min-height:62px; padding:5px;}
  .cal-cell .dsub{display:none;}
  .week-row .wstats{width:auto;}
  .week-row{flex-wrap:wrap;}
}

/* ---------- Back office ---------- */
.admin-shell{display:flex; min-height:100vh; background:var(--paper-50);}
.admin-sidebar{width:230px; background:var(--teal-900); color:#fff; flex-shrink:0; display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.admin-nav{margin-top:22px; display:flex; flex-direction:column; gap:4px; flex:1;}
.admin-nav button{display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:rgba(255,255,255,.8); padding:11px 12px; border-radius:10px; font-size:13.8px; font-weight:600; min-height:42px;}
.admin-nav button.active{background:rgba(255,255,255,.14); color:#fff;}
.admin-nav button:hover{background:rgba(255,255,255,.08);}
.admin-nav .ic{width:18px; text-align:center;}
.admin-exit{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.14);}
.admin-exit .signed-in-as{font-size:11.5px; color:rgba(255,255,255,.75); padding:0 4px 8px;}
.admin-exit .signed-in-as strong{color:#fff;}
.admin-exit button{width:100%; background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:10px; padding:11px; font-size:13px; font-weight:700; margin-top:6px;}
.admin-main{flex:1; padding:24px 28px 80px; min-width:0;}
.admin-topline{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:18px;}
.admin-topline h1{font-size:23px;}
.admin-topline .sub{color:var(--ink-500); font-size:13.5px; margin-top:3px; max-width:640px; line-height:1.45;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;}
.toolbar select, .toolbar input[type=text], .toolbar input[type=search], .toolbar input[type=date]{border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px; background:var(--paper-0); color:var(--ink-900); min-height:42px;}
.toolbar .grow{flex:1; min-width:180px;}
.site-select{font-weight:700;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-card);}
.stat-card .num{font-family:var(--font-display); font-size:28px; color:var(--teal-900); font-weight:700;}
.stat-card .lbl{font-size:12.5px; color:var(--ink-500); font-weight:600; margin-top:2px;}
.panel{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-card); overflow:hidden; margin-bottom:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.panel-head h2{font-size:17px;}
.panel-body{padding:14px 16px;}
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-500); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--paper-50); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--line); font-size:13.6px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
.group-row td{background:var(--paper-100); font-size:12.5px; color:var(--ink-700); padding:8px 12px;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.status-pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap;}
.status-pill.active{background:var(--ok-100); color:var(--ok-700);}
.status-pill.inactive{background:var(--paper-100); color:var(--ink-500);}
.status-pill.warn{background:var(--coral-100); color:var(--coral-700);}
.status-pill.amber{background:var(--amber-100); color:var(--amber-700);}
.status-pill.teal{background:var(--teal-100); color:var(--teal-800);}
.small-meta{font-size:12px; color:var(--ink-500); line-height:1.45;}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.empty-row{text-align:center; color:var(--ink-500); padding:30px 16px; font-size:13.5px;}

.checkbox-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:8px;}

.switch-label{display:inline-flex; align-items:center; gap:10px; font-size:14px; font-weight:700; color:var(--ink-900); cursor:pointer; background:var(--paper-0); border:1.5px solid var(--line); border-radius:999px; padding:6px 8px 6px 14px; min-height:44px;}

    if(t.schedule_type==='any_day_month') return monthStart(ds);
    return ds;
  }
  function periodEnd(t, key){
    if(t.schedule_type==='any_day_week') return addDays(key,6);
    if(t.schedule_type==='any_day_month') return monthEnd(key);
    return key;
  }
  function n(t){ return Math.max(1, parseInt(t.interval_n,10)||1); }

  /* Does a (non-period) task fall on this date, ignoring start/end? */
  function matches(t, ds){
    var p, start=t.start_date;
    switch(t.schedule_type){
      case 'once': return ds===start;
      case 'daily': return true;
      case 'every_n_days': var d=diffDays(ds,start); return d>=0 && d%n(t)===0;
      case 'weekly':
        if((t.weekdays||[]).map(Number).indexOf(weekday(ds))===-1) return false;
        var wk=Math.floor(diffDays(weekStart(ds), weekStart(start))/7);
        return wk>=0 && wk%n(t)===0;
      case 'monthly_day':
        p=parts(ds);
        var mi=monthIndex(ds)-monthIndex(start); if(mi<0 || mi%n(t)!==0) return false;
        return p[2]===Math.min(parseInt(t.month_day,10)||1, daysInMonth(p[0],p[1]));
      case 'monthly_nth':
        p=parts(ds);
        var mj=monthIndex(ds)-monthIndex(start); if(mj<0 || mj%n(t)!==0) return false;
        return p[2]===nthWeekday(p[0],p[1],parseInt(t.nth,10),parseInt(t.nth_weekday,10));
    }
    return false;
  }

  /* Returns the completion key if the task is due (or open, for period
     tasks) on this date, otherwise null. Paused tasks are never due. */
  function dueKey(t, ds){
    if(!t.active) return null;
    if(isPeriod(t)){
      var key=periodKey(t, ds), end=periodEnd(t,key);
      if(end < t.start_date) return null;
      if(t.end_date && key > t.end_date) return null;
      return key;
    }
    if(ds < t.start_date) return null;
    if(t.end_date && ds > t.end_date) return null;
    return matches(t, ds) ? ds : null;
  }

  /* Everything due on one date: [{task, key}] */
  function itemsOn(tasks, ds){
    var out=[];
    for(var i=0;i<tasks.length;i++){ var k=dueKey(tasks[i], ds); if(k) out.push({task:tasks[i], key:k}); }
    return out;
  }

  /* Carry-over tasks from earlier days that still aren't done.
     isDone(taskId, key) -> bool. Looks back `lookback` days. */
  function outstanding(tasks, isDone, today, lookback){
    var out=[], from=addDays(today, -(lookback||62));
    tasks.forEach(function(t){
      if(!t.active || t.if_missed!=='carry') return;
      var seen={};
      var d = t.start_date > from ? t.start_date : from;
      if(isPeriod(t)) d = periodKey(t, d);
      for(; d < today; d=addDays(d,1)){
        var k=dueKey(t, d);
        if(!k || seen[k]) continue;
        seen[k]=true;
        if(periodEnd(t,k) >= today) continue; // still in its period — not overdue yet
        if(!isDone(t.id, k)) out.push({task:t, key:k});
      }
    });
    out.sort(function(a,b){ return a.key<b.key?-1:a.key>b.key?1:0; });
    return out;
  }

  /* All distinct due items between two dates (inclusive), for reports and the calendar. */
  function itemsBetween(tasks, from, to){
    var out=[], seen={};
    for(var d=from; d<=to; d=addDays(d,1)){
      itemsOn(tasks, d).forEach(function(it){
        var id=it.task.id+'|'+it.key;
        if(seen[id]) return; seen[id]=true;
        out.push(it);
      });
    }
    return out;
  }

  /* Next few due dates — shown as a preview when editing a task. */
  function nextDates(t, fromDs, count){
    var out=[], copy=Object.assign({}, t, {active:true}), last=null;
    for(var i=0, d=fromDs; i<800 && out.length<(count||5); i++, d=addDays(d,1)){
      var k=dueKey(copy, d);
      if(k && k!==last){ out.push(isPeriod(copy) ? k : d); last=k; }
    }
    return out;
  }

  return { pad:pad, dn:dn, fromDn:fromDn, addDays:addDays, diffDays:diffDays, weekday:weekday, weekStart:weekStart,
    monthStart:monthStart, monthEnd:monthEnd, addMonths:addMonths, daysInMonth:daysInMonth, nthWeekday:nthWeekday,
    siteToday:siteToday, siteNowHM:siteNowHM, isPeriod:isPeriod, periodKey:periodKey, periodEnd:periodEnd,

function esc(s){

  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DOW_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(ds){ if(!ds) return ''; return ds.slice(8,10)+'/'+ds.slice(5,7)+'/'+ds.slice(0,4); }
function fmtDay(ds){ return DOW[Sched.weekday(ds)-1]+' '+fmtDate(ds); }
function fmtDayShort(ds){ return DOW[Sched.weekday(ds)-1]+' '+ds.slice(8,10)+'/'+ds.slice(5,7); }
function fmtMonth(ds){ return MONTHS[parseInt(ds.slice(5,7),10)-1]+' '+ds.slice(0,4); }
function siteTz(){ var s=currentSite(); return (s && s.timezone) || 'Europe/London'; }
function fmtTime(iso, tz){
  if(!iso) return '';
  try{ return new Intl.DateTimeFormat('en-GB',{timeZone:tz||'Europe/London', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date(iso)); }catch(e){ return ''; }
}
function fmtDateTime(iso, tz){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d.getTime())) return '';
  return fmtDate(Sched.siteToday(tz||'Europe/London', d))+' '+fmtTime(iso, tz);
}
function updatedLine(r){
  if(!r || !r.updated_at) return '';

  return r.updated_by_name ? 'Updated by '+esc(r.updated_by_name)+' · '+d : 'Updated '+d;
}
function hm(t){ return t ? String(t).slice(0,5) : ''; }
function pct(a,b){ return b>0 ? Math.round(a*100/b) : null; }
function pctClass(p){ return p===null ? 'f' : p>=100 ? 'g' : p>=80 ? 'a' : 'r'; }
function plural(n, one, many){ return n+' '+(n===1?one:(many||one+'s')); }
function byOrder(a,b){ return (a.sort_order||0)-(b.sort_order||0) || String(a.title||a.name||'').localeCompare(String(b.title||b.name||'')); }
function uniq(arr){ var o={}, out=[]; arr.forEach(function(x){ if(!o[x]){ o[x]=1; out.push(x); } }); return out; }
function chunk(arr, n){ var out=[]; for(var i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }
function safeErrText(e){ try{ if(!e) return 'Unknown error'; if(typeof e==='string') return e; if(e.message) return String(e.message); return String(e); }catch(_){ return 'Unknown error'; } }

/* Turns any error into a short, friendly sentence. Messages written by the
   database functions are already plain English, so they pass straight through. */
function friendly(e){
  var m = safeErrText(e);
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Can’t connect right now. Please check the internet connection and try again.';
  if(/Invalid login credentials/i.test(m)) return 'That username or PIN isn’t right.';
  if(/JWT|refresh token|not authenticated|session/i.test(m)) return 'You’ve been logged out. Please log in again.';
  if(/foreign key/i.test(m)) return 'This is still being used elsewhere, so it can’t be removed yet.';
  if(/row-level security|permission denied|violates row/i.test(m)) return 'Your login isn’t allowed to do that.';
  if(/duplicate key|already exists/i.test(m)) return 'That already exists.';
  if(/check constraint/i.test(m)) return 'Some of the details aren’t valid. Please check and try again.';
  if(/^[A-Z][^{}<>]{3,160}[.!?]$/.test(m) && !/relation|column|function|syntax|constraint|schema/i.test(m)) return m;
  return 'Something went wrong. Please try again.';
}

/* The server returns at most 1,000 rows per request, so large lists are
   fetched page by page. `build` must return a fresh, ordered query. */
async function fetchAll(build){
  var out=[], from=0, size=1000;
  for(var guard=0; guard<500; guard++){
    var r = await build().range(from, from+size-1);
    if(r.error) throw r.error;
    out = out.concat(r.data||[]);
    if(!r.data || r.data.length<size) break;
    from += size;
  }
  return out;
}
async function one(q){ var r=await q; if(r.error) throw r.error; return r.data; }
async function rpc(name, args){ var r=await sb.rpc(name, args||{}); if(r.error) throw r.error; return r.data; }

function compKey(taskId, key){ return taskId+'|'+key; }

/* Loads ticks, assignments and sign-off for one site and date (plus
   overdue carry-over items when the date is today). */
async function loadDay(siteId, date){
  var base = await loadSiteBase(siteId);
  var today = todayFor(siteId);
  var keys = uniq([date, Sched.weekStart(date), Sched.monthStart(date)]);
  var jobs = [
    fetchAll(function(){ return sb.from('completions').select('*').eq('site_id', siteId).in('occurrence_date', keys).order('id'); }),
    fetchAll(function(){ return sb.from('assignments').select('*').eq('site_id', siteId).in('occurrence_date', keys).order('id'); }),
    one(sb.from('day_signoffs').select('*').eq('site_id', siteId).eq('day', date).maybeSingle())
  ];
  var carryIds = date===today ? base.tasks.filter(function(t){ return t.active && t.if_missed==='carry'; }).map(function(t){ return t.id; }) : [];
  var from = Sched.addDays(today, -(S.settings.history_days||62) - 31);
  chunk(carryIds, 80).forEach(function(ids){
    jobs.push(fetchAll(function(){ return sb.from('completions').select('*').eq('site_id', siteId).in('task_id', ids).gte('occurrence_date', from).lt('occurrence_date', today).order('id'); }));
  });
  var res = await Promise.all(jobs);
  var comps={}, assigns={};
  res[0].forEach(function(c){ comps[compKey(c.task_id, c.occurrence_date)] = c; });
  for(var i=3;i<res.length;i++) res[i].forEach(function(c){ comps[compKey(c.task_id, c.occurrence_date)] = c; });
  res[1].forEach(function(a){ assigns[compKey(a.task_id, a.occurrence_date)] = a; });
  var overdue = date===today ? Sched.outstanding(base.tasks, function(id,k){ return !!comps[compKey(id,k)]; }, today, S.settings.history_days||62) : [];
  // overdue assignments live on their original date
  if(overdue.length){
    var oKeys = uniq(overdue.map(function(o){ return o.key; })).filter(function(k){ return keys.indexOf(k)===-1; });
    for(var c=0;c<oKeys.length;c+=50){
      var batch=oKeys.slice(c,c+50);
      var extra = await fetchAll(function(){ return sb.from('assignments').select('*').eq('site_id', siteId).in('occurrence_date', batch).order('id'); });
      extra.forEach(function(a){ assigns[compKey(a.task_id, a.occurrence_date)] = a; });
    }
  }
  S.day = { loading:false, error:'', comps:comps, assigns:assigns, signoff:res[2], overdue:overdue, loadedFor:siteId+'|'+date };
}

/* Completions + sign-offs over a date range for one or more sites (calendar & reports). */
async function loadRange(siteIds, from, to){
  var comps=[], signs=[];
  // period tasks store their tick against the Monday / 1st, which can sit before `from`
  var qFrom = Sched.addDays(Sched.monthStart(from), -7);
  for(var i=0;i<siteIds.length;i+=4){
    var batch=siteIds.slice(i,i+4);
    var res = await Promise.all(batch.map(function(id){
      return Promise.all([
        fetchAll(function(){ return sb.from('completions').select('id,site_id,task_id,occurrence_date,status,completed_by_name,completed_at,note').eq('site_id', id).gte('occurrence_date', qFrom).lte('occurrence_date', to).order('id'); }),
        fetchAll(function(){ return sb.from('day_signoffs').select('site_id,day,signed_by_name,created_at,note').eq('site_id', id).gte('day', from).lte('day', to).order('day'); })
      ]);
    }));
    res.forEach(function(r){ comps=comps.concat(r[0]); signs=signs.concat(r[1]); });
  }
  return { comps:comps, signoffs:signs };
}

/* Summarise a site's due items over a range: done / not needed / missed / outstanding / upcoming. */
function summarise(tasks, compMap, from, to, today){
  var items = Sched.itemsBetween(tasks, from, to < today ? to : (to > today ? today : to));
  var res = { due:0, done:0, excused:0, missed:0, outstanding:0, open:0, items:[] };
  items.forEach(function(it){
    var c = compMap[compKey(it.task.id, it.key)];
    var end = Sched.periodEnd(it.task, it.key);
    var st = c ? (c.status==='excused' ? 'excused' : 'done') : (end < today ? (it.task.if_missed==='carry' ? 'outstanding' : 'missed') : 'open');
    res.due++; res[st]++;
    res.items.push({ task:it.task, key:it.key, status:st, comp:c||null });
  });
  return res;
}

function itemStatus(it, ctx){
  var c = S.day.comps[compKey(it.task.id, it.key)];
  if(c) return c.status==='excused' ? 'excused' : 'done';
  if(ctx.isFuture) return 'upcoming';

  return 'open';
}
function isLate(it, ctx){
  if(!ctx.isToday || !it.task.due_time || Sched.isPeriod(it.task)) return false;
  return Sched.siteNowHM(ctx.tz) > hm(it.task.due_time);
}
function scheduleHint(t, key){
  if(t.schedule_type==='any_day_week') return 'Any day this week · by '+fmtDayShort(Sched.periodEnd(t,key));
  if(t.schedule_type==='any_day_month') return 'Any day this month · by '+fmtDayShort(Sched.periodEnd(t,key));
  return '';
}
function scheduleText(t){
  var n = Math.max(1, parseInt(t.interval_n,10)||1);
  var days = (t.weekdays||[]).map(Number).sort().map(function(d){ return DOW[d-1]; }).join(', ');
  var nthWord = {'1':'First','2':'Second','3':'Third','4':'Fourth','-1':'Last'}[String(t.nth)] || '';
  var txt;
  switch(t.schedule_type){
    case 'once': txt='Once, on '+fmtDate(t.start_date); break;
    case 'daily': txt='Every day'; break;
    case 'weekly': txt=(n===1?'Every week':'Every '+n+' weeks')+' on '+(days||'—'); break;
    case 'monthly_day': txt=(n===1?'Monthly':'Every '+n+' months')+' on '+(parseInt(t.month_day,10)>=31?'the last day':'day '+t.month_day); break;
    case 'monthly_nth': txt=(n===1?'Monthly':'Every '+n+' months')+' · '+nthWord+' '+(DOW_LONG[(t.nth_weekday||1)-1]); break;
    case 'every_n_days': txt='Every '+plural(n,'day'); break;
    case 'any_day_week': txt='Any day each week'; break;
    case 'any_day_month': txt='Any day each month'; break;
    default: txt=t.schedule_type;
  }
  if(t.due_time) txt += ' · by '+hm(t.due_time);
  return txt;
}

function ringSvg(p){
  var r=36, c=2*Math.PI*r, v=p===null?0:Math.max(0,Math.min(100,p));
  var col = p===null ? 'var(--line)' : v>=100 ? 'var(--ok-600)' : v>=80 ? 'var(--amber-500)' : 'var(--coral-600)';
  return '<div class="ring" aria-label="'+(p===null?'Nothing due':v+'% done')+'"><svg width="84" height="84" viewBox="0 0 84 84">'+
    '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--paper-100)" stroke-width="9"/>'+
    '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(c*v/100)+' '+c+'"/>'+
    '</svg><div class="pct">'+(p===null?'—':v+'%')+'</div></div>';
}

function taskRow(it, ctx, overdueRow, areaLabel){
  var t=it.task, k=compKey(t.id, it.key);
  var c=S.day.comps[k], a=S.day.assigns[k];
  var st = overdueRow ? (c ? (c.status==='excused'?'excused':'done') : 'overdueOpen') : itemStatus(it, ctx);
  var pending = !!S.pending[k];
  var canTick = canWork(ctx.siteId) && !ctx.isFuture;
  var cls='task-row'+(t.audience==='management'?' is-mgmt':''), tickCls='tick', tickInner='';
  if(st==='done'){ cls+=' is-done'; tickCls+=' done'; tickInner='✓'; }
  else if(st==='excused'){ cls+=' is-excused'; tickCls+=' excused'; tickInner='–'; }
  else if(st==='missed'){ cls+=' is-missed'; tickCls+=' missed'; tickInner='✕'; }
  else if(st==='carried'){ tickCls+=' locked'; }
  if(overdueRow && st==='overdueOpen') cls+=' is-overdue';
  if(pending) tickCls+=' pending';
  // Ticking: today's items and overdue items; on past days only managers can record late.
  var tickable = canTick && (overdueRow || ctx.isToday || (ctx.isPast && canSignOff(ctx.siteId) && st!=='carried'));
  if(!tickable) tickCls+=' readonly';
  var tickLabel = st==='done' ? 'Done. Tap to un-tick' : st==='excused' ? 'Marked not needed' : 'Tick '+t.title;
  var tickBtn = '<button type="button" class="'+tickCls+'" '+(tickable?'data-a="tick" data-t="'+t.id+'" data-k="'+it.key+'"':'data-a="tickInfo" data-t="'+t.id+'" data-k="'+it.key+'" data-st="'+st+'"')+' aria-label="'+esc(tickLabel)+'">'+tickInner+'</button>';

  var metas=[];
  if(overdueRow){
    var late = Sched.diffDays(ctx.today, Sched.periodEnd(t, it.key));
    metas.push('<span class="meta late">Due '+(Sched.isPeriod(t) ? 'by '+fmtDayShort(Sched.periodEnd(t,it.key)) : fmtDayShort(it.key))+' · '+plural(late,'day')+' overdue</span>');
    if(it.more) metas.push('<span class="meta missed">+'+it.more+' later '+(it.more===1?'one':'ones')+' also not done</span>');
  } else {
    var hint=scheduleHint(t, it.key); if(hint) metas.push('<span class="meta period">'+esc(hint)+'</span>');
    if(t.due_time && !Sched.isPeriod(t)){
      metas.push(isLate(it, ctx) && st==='open' ? '<span class="meta late">Late · was due by '+hm(t.due_time)+'</span>' : '<span class="meta time">By '+hm(t.due_time)+'</span>');
    }
  }
  if(t.audience==='management' && overdueRow) metas.push('<span class="meta mgmt">Management</span>');
  if(areaLabel) metas.push('<span class="meta area">'+esc(areaLabel)+'</span>');
  if(a) metas.push('<span class="meta assign">Assigned to '+esc(a.assigned_name)+'</span>');
  if(c){
    var when = fmtTime(c.completed_at, ctx.tz), onDay = Sched.siteToday(ctx.tz, new Date(c.completed_at));
    var whenTxt = (onDay!==ctx.date ? fmtDayShort(onDay)+' ' : '')+when;
    if(c.status==='excused') metas.push('<span class="meta">Not needed · '+esc(c.completed_by_name||'')+' · '+whenTxt+'</span>');
    else metas.push('<span class="meta done">✓ '+esc(c.completed_by_name||'Done')+' · '+whenTxt+'</span>');
  } else if(st==='missed'){ metas.push('<span class="meta missed">Missed</span>'); }
  else if(st==='carried'){ metas.push('<span class="meta carry">Not done · carried over</span>'); }

  var cl = (t.checklist||[]);
  if(cl.length){
    if(c && Array.isArray(c.checklist) && c.checklist.length){
      var nDone=c.checklist.filter(function(x){ return x.done; }).length, missed=c.checklist.filter(function(x){ return !x.done; }).map(function(x){ return x.item; });
      metas.push('<span class="meta '+(missed.length?'late':'done')+'">☑ '+nDone+' of '+c.checklist.length+' checks'+(missed.length?' · not done: '+esc(missed.join(', ')):'')+'</span>');
    } else if(!c) metas.push('<span class="meta check">☑ '+plural(cl.length,'check')+'</span>');
  }
  var note = c && c.note ? '<div class="task-note">'+(c.status==='excused'?'<strong>Reason:</strong> ':'📝 ')+esc(c.note)+'</div>' : '';
  var side = '<div class="task-side">'+
    (t.instructions || (t.checklist||[]).length ? '<button type="button" class="round-btn" data-a="info" data-t="'+t.id+'" aria-label="How to do this task">i</button>' : '')+
    '<button type="button" class="round-btn more" data-a="more" data-t="'+t.id+'" data-k="'+it.key+'" aria-label="More options">⋯</button>'+
  '</div>';
  return '<div class="'+cls+'" data-row="'+k+'">'+tickBtn+
    '<div class="task-body"><div class="task-title">'+esc(t.title)+'</div>'+(metas.length?'<div class="task-meta">'+metas.join('')+'</div>':'')+note+'</div>'+
    side+'</div>';
}

function dayContext(){
  var site=currentSite(), tz=(site&&site.timezone)||'Europe/London';
  var today=Sched.siteToday(tz), date=S.date||today;
  return { siteId:S.siteId, site:site, tz:tz, today:today, date:date, isToday:date===today, isPast:date<today, isFuture:date>today };
}

function dayStats(items, ctx){
  var s={total:items.length, handled:0, done:0, excused:0, late:0, missed:0};
  items.forEach(function(it){
    var st=itemStatus(it, ctx);
    if(st==='done'){ s.done++; s.handled++; }
    else if(st==='excused'){ s.excused++; s.handled++; }
    else if(st==='missed' || st==='carried') s.missed++;
    else if(isLate(it, ctx)) s.late++;
  });
  s.pct = pct(s.handled, s.total);
  return s;
}

function renderTopbar(titleHtml, subHtml, opts){
  opts=opts||{};
  var many = mySites().length>1;
  var back = opts.back || '';
  var title = (opts.siteSwitch && many) ? siteSwitchHtml() : '<h1>'+titleHtml+'</h1>';
  return '<div class="topbar no-print">'+back+
    '<div class="topbar-title">'+title+(subHtml?'<div class="sub">'+subHtml+'</div>':'')+'</div>'+
    '<div class="topbar-actions">'+(opts.actions||'')+
      (S.me && canBackOffice() ? '<button class="icon-btn" data-a="openAdmin" title="Back office" aria-label="Back office">⚙️</button>' : '')+
      (S.me ? '<button class="icon-btn" data-a="account" title="Your account" aria-label="Your account">👤</button>' : '')+
    '</div></div>';
}

function siteSwitchHtml(){
  var groups=groupByBrand(mySites());
  return '<label class="visually-hidden" for="siteSwitch">Site</label><select id="siteSwitch" class="site-switch" data-a-change="switchSite">'+groups.map(function(g){
    var o=g.sites.map(function(s){ return '<option value="'+s.id+'"'+(s.id===S.siteId?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('');
    return groups.length>1 ? '<optgroup label="'+esc(g.brand||'Other sites')+'">'+o+'</optgroup>' : o;
  }).join('')+'</select>';
}

function renderDay(){
  var ctx=dayContext(), site=ctx.site;
  if(!site) return renderLanding();
  var head = renderTopbar(esc(site.name), 'Signed in as '+esc(S.me?S.me.display_name:''),
    { siteSwitch:true, actions:'<button class="icon-btn" data-a="openCalendar" title="Calendar" aria-label="Calendar">📅<span class="lbl hide-sm"></span></button>' });
  var base=S.cache[ctx.siteId];
  var datebar = '<div class="datebar">'+
    '<button class="nav-btn" data-a="dayShift" data-n="-1" aria-label="Previous day">‹</button>'+
    '<div class="date-label"><small>'+(ctx.isToday?'Today':ctx.isPast?'Past day':'Coming up')+'</small>'+DOW_LONG[Sched.weekday(ctx.date)-1]+' '+fmtDate(ctx.date)+'</div>'+
    '<button class="nav-btn" data-a="dayShift" data-n="1" aria-label="Next day">›</button>'+

    '<button class="nav-btn" data-a="openCalendar"><span class="lbl">📅 Calendar</span></button>'+

  if(!base || S.day.loadedFor!==ctx.siteId+'|'+ctx.date){

    return head+'<main><div class="wrap-day">'+datebar+body+'</div></main>';
  }

  var items = Sched.itemsOn(base.tasks, ctx.date);

  var html = (ctx.isToday && canSignOff(ctx.siteId) ? exportBanner() : '') + datebar;

  if(ctx.isPast) html += '<div class="mode-banner past">You’re looking at a past day. This shows what was done, by whom, and what was missed.'+(canSignOff(ctx.siteId)?' As a manager you can still record a late tick or mark something as not needed.':'')+'</div>';
  if(ctx.isFuture) html += '<div class="mode-banner future">Coming up. Tasks can’t be ticked yet, but you can assign them to someone for this day (tap ⋯).</div>';

  var ov = ctx.isToday ? overdueView(ctx) : {rows:[], openTasks:0};
  var overdueOpen = ov.openTasks;
  if(overdueOpen){
    html += '<button class="overdue-alert" data-a="jumpOverdue"><span class="big">⚠️</span><span><strong>'+plural(overdueOpen,'overdue task')+' from earlier days</strong><span>These carry over until they\u2019re done. Tap to see them.</span></span></button>';
  }

  html += '<div class="day-top"><div class="day-top-l">';
  // summary / % widget
  var chips = '';
  if(stats.late) chips += '<span class="chip-stat late">'+stats.late+' late</span>';
  if(stats.missed) chips += '<span class="chip-stat red">'+stats.missed+' not done</span>';
  if(stats.excused) chips += '<span class="chip-stat grey">'+stats.excused+' not needed</span>';
  if(overdueOpen) chips += '<span class="chip-stat red">'+overdueOpen+' overdue</span>';
  var signBtn = (canSignOff(ctx.siteId) && !ctx.isFuture && !S.day.signoff && items.length) ? '<button class="btn btn-primary" data-a="signoff">✍️ Sign off the day</button>' : '';
  html += '<div class="summary-card">'+ringSvg(ctx.isFuture?null:stats.pct)+
    '<div class="summary-main"><h2>'+(ctx.isFuture ? plural(stats.total,'task')+' due' : stats.handled+' of '+stats.total+' done')+'</h2>'+
      '<div class="sub">'+(stats.total? (ctx.isFuture?'Planned for this day.':'Across '+plural(countSections(items),'section')+'.') : 'Nothing is scheduled for this day.')+'</div>'+chips+'</div>'+
    (signBtn?'<div class="summary-actions">'+signBtn+'</div>':'')+
  '</div>';
  if(S.day.signoff){
    var so=S.day.signoff;
    html += '<div class="signed-off-box">✅ Day signed off by '+esc(so.signed_by_name||'a manager')+' · '+fmtDateTime(so.created_at, ctx.tz)+(so.note?'<div style="font-weight:500; margin-top:4px;">'+esc(so.note)+'</div>':'')+
      (canSignOff(ctx.siteId)?' <button class="btn btn-sm btn-outline" style="margin-left:6px;" data-a="unsignoff">Undo sign-off</button>':'')+'</div>';
  }

  html += '</div><div class="day-top-r">';
  // who's ticking
  if(site.who_mode!=='off' && canWork(ctx.siteId) && (ctx.isToday || ctx.isPast && canSignOff(ctx.siteId))){
    var tk = activeTicker();
    html += '<div class="who-bar"><div class="who-label">'+(tk ? 'Ticking as <strong>'+esc(tk.name)+'</strong>' : (site.who_mode==='required' ? '<strong>Who’s ticking?</strong> Choose your name before ticking.' : '<strong>Who’s ticking?</strong> Choose your name so ticks are credited to you.'))+'</div>'+
      '<button class="btn btn-sm btn-outline" data-a="chooseTicker">'+(tk?'Change':'Choose name')+'</button>'+
      (tk?'<button class="btn btn-sm btn-ghost" data-a="clearTicker">Done</button>':'')+'</div>';
  }

  // ---- what to show: team / management tab, area, done tasks ----
  var vo = viewOpts();
  var siteAreas = (base.areas||[]).slice().sort(byOrder);
  var area = vo.area[ctx.siteId] || 'all';
  if(area!=='all' && !siteAreas.some(function(a){ return a.id===area; })) area='all';
  var hasMgmt = base.tasks.some(function(t){ return t.active && t.audience==='management'; });
  var tab = hasMgmt ? (vo.tab==='management' ? 'management' : 'team') : 'all';
  function inView(t, ignoreTab){ return (ignoreTab || tab==='all' || (tab==='management') === (t.audience==='management')) && (area==='all' || t.area_id===area); }
  var now=Date.now();
  function visible(it){
    if(vo.showDone) return true;
    var c=S.day.comps[compKey(it.task.id,it.key)];
    if(!c) return true;
    var r=S.recent[compKey(it.task.id,it.key)];
    return !!(r && now-r < UNDO_SECONDS*1000+300);   // keep a just-ticked task in view while Undo is offered
  }

  if(hasMgmt){
    var tabBtn = function(key, label){
      var list=items.filter(function(it){ return (key==='management')===(it.task.audience==='management') && (area==='all' || it.task.area_id===area); });
      var st=dayStats(list, ctx);
      var od=ov.rows.filter(function(o){ return (key==='management')===(o.task.audience==='management') && !S.day.comps[compKey(o.task.id,o.key)]; }).length;
      return '<button class="vtab'+(tab===key?' active':'')+(key==='management'?' mgmt':'')+'" data-a="viewTab" data-v="'+key+'" aria-pressed="'+(tab===key)+'">'+
        '<strong>'+label+'</strong><span>'+(ctx.isFuture?plural(st.total,'task'):st.handled+' of '+st.total+' done')+'</span>'+(od?'<em>⚠️ '+od+' overdue</em>':'')+'</button>';
    };
    html += '<div class="view-tabs" role="group" aria-label="Which tasks">'+tabBtn('team','Team tasks')+tabBtn('management','Team leader & management')+'</div>';
  }
  if(siteAreas.length){
    html += '<div class="chip-row" role="group" aria-label="Area">'+
      '<button class="chip'+(area==='all'?' active':'')+'" data-a="viewArea" data-v="all">All areas</button>'+
      siteAreas.map(function(a){
        var n=items.filter(function(it){ return it.task.area_id===a.id && inView(it.task); }).length;
        return '<button class="chip'+(area===a.id?' active':'')+'" data-a="viewArea" data-v="'+a.id+'">'+esc(a.name)+' <span class="chip-n">'+n+'</span></button>';
      }).join('')+'</div>';
  }
  var shownItems = items.filter(function(it){ return inView(it.task); });
  var doneCount = shownItems.filter(function(it){ return S.day.comps[compKey(it.task.id,it.key)]; }).length;
  if(!ctx.isFuture && shownItems.length){
    html += '<div class="filter-row"><span class="small-meta">'+(vo.showDone ? 'Showing everything' : (doneCount ? plural(doneCount,'done task')+' hidden' : 'Showing tasks still to do'))+'</span>'+
      '<label class="switch-label"><span>Show done tasks</span><span class="switch"><input type="checkbox" data-a="toggleDone"'+(vo.showDone?' checked':'')+'><span class="track"></span></span></label></div>';
  }

  html += '</div></div>';
  // overdue section (one row per task: the oldest one not done yet)
  var ovRows = ov.rows.filter(function(o){ return inView(o.task) && visible(o); });
  if(ovRows.length){
    var limit = S.day.showAllOverdue ? ovRows.length : 5;
    var ovOpenHere = ovRows.filter(function(o){ return !S.day.comps[compKey(o.task.id,o.key)]; }).length;
    var oRows = ovRows.slice(0, limit).map(function(o){ return taskRow(o, ctx, true); }).join('');
    var moreBtn = ovRows.length>limit ? '<button class="btn btn-outline btn-block" data-a="showAllOverdue">Show all '+ovRows.length+' overdue</button>' : (S.day.showAllOverdue && ovRows.length>5 ? '<button class="btn btn-ghost btn-block" data-a="showAllOverdue">Show fewer</button>' : '');
    html += '<section class="section-block" id="sec-overdue"><div class="section-head overdue"><h2>⚠️ Overdue from earlier days</h2><span class="count-pill">'+ovOpenHere+' still to do</span></div><div class="task-list">'+oRows+moreBtn+'</div></section>';
  }

  // sections
  var bySec={}; shownItems.forEach(function(it){ (bySec[it.task.section_id]=bySec[it.task.section_id]||[]).push(it); });
  var secs = base.sections.slice().sort(byOrder);
  var known={}; secs.forEach(function(s){ known[s.id]=1; });
  var areaName={}; siteAreas.forEach(function(a){ areaName[a.id]=a.name; });
  function block(title, list){
    list.sort(function(a,b){ return byOrder(a.task,b.task); });
    var sstats=dayStats(list, ctx), rows=list.filter(visible);
    var allDone = !ctx.isFuture && sstats.handled===sstats.total;
    return '<section class="section-block"><div class="section-head"><h2>'+esc(title)+'</h2><span class="count-pill'+(allDone?' done':'')+'">'+(ctx.isFuture?plural(sstats.total,'task'):(allDone?'✓ All done':sstats.handled+' of '+sstats.total+' done'))+'</span></div>'+
      (rows.length ? '<div class="task-list">'+rows.map(function(it){ return taskRow(it, ctx, false, area==='all'?areaName[it.task.area_id]:''); }).join('')+'</div>'
                   : '<div class="all-done-note">All '+plural(sstats.total,'task')+' done. Switch on “Show done tasks” to see them.</div>')+'</section>';
  }
  var blocks = secs.map(function(sec){ var l=bySec[sec.id]||[]; return l.length ? block(sec.name, l) : ''; }).join('');
  var orphan = shownItems.filter(function(it){ return !known[it.task.section_id]; });
  if(orphan.length) blocks += block('Other', orphan);
  blocks = '<div class="sections-grid">'+blocks+'</div>';
  if(!items.length) blocks = '<div class="empty-note">Nothing scheduled for '+fmtDay(ctx.date)+'.'+(canManage(ctx.siteId)?'<br>Add tasks in the back office (⚙️).':'')+'</div>';
  else if(!shownItems.length) blocks = '<div class="empty-note">No '+(tab==='management'?'management ':tab==='team'?'team ':'')+'tasks'+(area!=='all'?' in '+esc(areaName[area]||'this area'):'')+' for '+fmtDay(ctx.date)+'.</div>';
  html += blocks;
  return head+'<main><div class="wrap-day">'+html+'</div></main>';
}
/* Groups overdue carry-over items by task. Shows the oldest one not done
   (that's the one still owed), plus any ticked off today for feedback. */
function overdueView(ctx){
  var groups={}, order=[];
  (S.day.overdue||[]).forEach(function(o){
    var g=groups[o.task.id]; if(!g){ g=groups[o.task.id]={open:[], done:[]}; order.push(g); }
    var c=S.day.comps[compKey(o.task.id,o.key)];
    if(!c) g.open.push(o);
    else if(Sched.siteToday(ctx.tz, new Date(c.completed_at))===ctx.today) g.done.push(o);
  });
  var rows=[], openTasks=0;
  order.forEach(function(g){
    if(g.open.length){ openTasks++; rows.push({task:g.open[0].task, key:g.open[0].key, more:g.open.length-1}); }
  });
  order.forEach(function(g){ g.done.forEach(function(o){ rows.push({task:o.task, key:o.key}); }); });
  return { rows:rows, openTasks:openTasks };
}
function countSections(items){ var o={}; items.forEach(function(it){ o[it.task.section_id]=1; }); return Object.keys(o).length; }

/* ---------- who's ticking (shared tablet) ---------- */
function activeTicker(){
  var t=S.ticker;
  if(!t || t.siteId!==S.siteId) return null;
  if(Date.now()-t.at > TICKER_IDLE_MINUTES*60000){ S.ticker=null; return null; }
  return t;
}

/* ---------- loading / navigation ---------- */
async function openSite(siteId, date){
  S.siteId=siteId; S.view='day'; rememberSite(siteId);
  S.date = date || todayFor(siteId);
  S.day.loadedFor=''; S.day.error='';
  updateUrl();
  render(true);
  await reloadDay();
}
async function reloadDay(silent){
  var want = S.siteId+'|'+S.date;
  try{
    await loadDay(S.siteId, S.date);
  }catch(e){
    console.error('Load failed: '+safeErrText(e));
    if(silent) return;
    S.day.error = friendly(e); S.day.loadedFor='';
  }
  if(S.view==='day' && want===S.siteId+'|'+S.date) render();
}
function shiftDay(n){
  S.date = Sched.addDays(S.date, n);
  S.day.loadedFor=''; render(true); reloadDay();
}

/* ---------- ticking ---------- */
async function doTick(taskId, key, opts){
  opts=opts||{};
  var ctx=dayContext(), site=ctx.site, k=compKey(taskId,key);
  var existing=S.day.comps[k];
  if(existing){ return askUntick(existing); }
  if(S.pending[k]) return;
  var task0 = taskById(taskId);
  // tasks with a checklist always open the checklist first
  if(!opts.fromChecklist && (opts.status||'done')==='done' && task0 && (task0.checklist||[]).length){
    return openModal({type:'tickNote', taskId:taskId, key:key, staffId:null, typedName:'', checks:{}});
  }
  var who = activeTicker();
  if(!opts.force && site.who_mode==='required' && !who && !opts.name){ return openModal({type:'ticker', staffId:null, typedName:'', then:{taskId:taskId, key:key}}); }
  S.pending[k]=true;
  // optimistic
  var fakeName = opts.name || (who?who.name:(S.me?S.me.display_name:''));
  S.day.comps[k] = { id:'pending', task_id:taskId, occurrence_date:key, status:opts.status||'done', completed_by_name:fakeName, completed_at:new Date().toISOString(), note:opts.note||'', checklist:opts.checklist||[], completed_by_user:S.me&&S.me.id };
  render();
  try{
    var id = await rpc('complete_task', {
      p_task_id:taskId, p_date:key,
      p_staff_id: opts.name!==undefined ? (opts.staffId||null) : (who && who.staffId || null),
      p_name: opts.name!==undefined ? opts.name : (who && !who.staffId ? who.name : null),
      p_pin: opts.name!==undefined ? (opts.pin||null) : (who && who.pin || null),
      p_note: opts.note||'', p_status: opts.status||'done', p_checklist: opts.checklist||null
    });
    S.day.comps[k].id = id;
    S.recent[k] = Date.now(); setTimeout(function(){ if(S.view==='day') render(); }, UNDO_SECONDS*1000+400);
    if(who) who.at = Date.now();
    delete S.pending[k];
    render();
    if((opts.status||'done')==='done'){
      toast('Ticked', 'Undo', function(){ undoTick(k); }, UNDO_SECONDS);
    } else toast('Marked as not needed');
  }catch(e){
    delete S.pending[k]; delete S.day.comps[k];
    render();
    var msg=friendly(e);
    if(/PIN/.test(msg) && S.ticker){ S.ticker=null; }
    toast(msg, null, null, 4.5);
    if(/already been signed off|no longer exists/.test(msg)) reloadDay(true);
  }
}
async function undoTick(k){
  hideToast();
  var c=S.day.comps[k]; if(!c || c.id==='pending') return;
  delete S.day.comps[k]; render();
  try{ await rpc('undo_completion', {p_id:c.id}); toast('Un-ticked'); }
  catch(e){ S.day.comps[k]=c; render(); toast(friendly(e), null, null, 4); }
}
function askUntick(c){
  var mine = S.me && c.completed_by_user===S.me.id && (Date.now()-new Date(c.completed_at).getTime() < 15*60000);
  if(!canSignOff(S.siteId) && !mine){ toast('Only a manager can un-tick this now.', null, null, 3.5); return; }
  confirmAction('Un-tick this task? It will show as not done again.', 'Un-tick', function(){ undoTick(compKey(c.task_id, c.occurrence_date)); });
}

async function doLogin(vals){
  var u=(vals.username||'').trim().toLowerCase(), p=(vals.pin||'').trim();
  S.login.username=u;
  if(!u || !p){ S.login.error='Please enter your username and PIN.'; return render(); }
  S.login.busy=true; S.login.error=''; render();
  try{
    var r = await sb.auth.signInWithPassword({ email:u+'@'+S.settings.login_domain, password:p });
    if(r.error) throw r.error;
    var me = await loadMe();
    if(!me){ await sb.auth.signOut(); throw new Error('This login isn’t set up properly. Please ask a master login holder.'); }
    if(!me.active){ await sb.auth.signOut(); S.me=null; throw new Error('This login has been switched off. Please speak to your manager.'); }
    S.login.busy=false;
    afterLogin();
  }catch(e){
    S.login.busy=false; S.login.error=friendly(e); render();
  }
}
function afterLogin(){
  if(S.me.must_change_pin){ S.view='changepin'; return render(); }
  if(canBackOffice()) rpc('run_housekeeping').catch(function(){});   // clears records past the "keep for" limit, once a day
  checkExportDue();
  var mine = mySites().filter(function(s){ return s.active; });
  // 1) a link straight to a site (e.g. a Teams tab), 2) the only site, 3) the site last used on this device
  var target = [S.deepSiteId, mine.length===1 ? mine[0].id : null, lastSite()].find(function(id){ return id && mine.some(function(s){ return s.id===id; }); });
  if(target) return openSite(target);
  if(!mine.length && canBackOffice()){ S.view='admin'; S.admin.screen='overview'; return enterAdmin(); }
  S.view='landing'; render(true);
}

function calRange(){
  var a=S.cal.anchor;
  if(S.cal.mode==='week'){ var ws=Sched.weekStart(a); return {from:ws, to:Sched.addDays(ws,6)}; }
  var ms=Sched.monthStart(a), me=Sched.monthEnd(a);
  return { from:Sched.weekStart(ms), to:Sched.addDays(Sched.weekStart(me),6) };
}
async function openCalendar(){
  S.view='calendar'; S.cal.anchor = S.cal.anchor && S.cal.siteId===S.siteId ? S.cal.anchor : (S.date||todayFor(S.siteId));
  S.cal.siteId=S.siteId;
  render(true); await loadCalendar();
}
async function loadCalendar(){
  var r=calRange(), want=S.siteId+'|'+r.from+'|'+r.to;
  S.cal.loading=true; S.cal.range=''; render();
  try{
    await loadSiteBase(S.siteId);
    var today=todayFor(S.siteId);
    var to = r.to < today ? r.to : today;
    var data = to>=r.from ? await loadRange([S.siteId], r.from, to) : {comps:[], signoffs:[]};
    if(want!==S.siteId+'|'+calRange().from+'|'+calRange().to) return;
    S.cal.comps=data.comps; S.cal.signoffs=data.signoffs; S.cal.range=want; S.cal.loading=false; S.cal.error='';
  }catch(e){ S.cal.loading=false; S.cal.error=friendly(e); }
  if(S.view==='calendar') render();
}
function calDayInfo(ds, base, compMap, today){
  var items=Sched.itemsOn(base.tasks, ds);
  if(ds>today) return { due:items.length, future:true };
  var h=0, miss=0;
  items.forEach(function(it){
    var c=compMap[compKey(it.task.id,it.key)];
    if(c) h++; else if(Sched.periodEnd(it.task,it.key)<today) miss++;
  });
  return { due:items.length, handled:h, missed:miss, pct:pct(h, items.length) };
}
function renderCalendar(){
  var site=currentSite(); if(!site) return renderLanding();
  var tz=site.timezone||'Europe/London', today=Sched.siteToday(tz), base=S.cache[S.siteId];
  var head=renderTopbar(esc(site.name)+' · Calendar', 'Tap a day to open it', { back:'<button class="back-pill" data-a="calBack">←<span> Day</span></button>' });
  var r=calRange();
  var title = S.cal.mode==='week' ? 'Week of '+fmtDate(Sched.weekStart(S.cal.anchor)) : fmtMonth(S.cal.anchor);
  var tb='<div class="cal-toolbar"><button class="nav-btn" data-a="calShift" data-n="-1" aria-label="Previous">‹</button><h2>'+title+'</h2>'+
    '<button class="nav-btn" data-a="calShift" data-n="1" aria-label="Next">›</button>'+
    '<button class="nav-btn" data-a="calToday"><span class="lbl">Today</span></button>'+
    '<div class="seg"><button class="'+(S.cal.mode==='month'?'active':'')+'" data-a="calMode" data-m="month">Month</button><button class="'+(S.cal.mode==='week'?'active':'')+'" data-a="calMode" data-m="week">Week</button></div></div>';
  var want=S.siteId+'|'+r.from+'|'+r.to;
  if(S.cal.error) return head+'<main><div class="wrap wrap-wide">'+tb+'<div class="empty-note">'+esc(S.cal.error)+'</div></div></main>';
  if(!base || S.cal.range!==want) return head+'<main><div class="wrap wrap-wide">'+tb+'<div class="loading"><div class="spinner"></div>Loading…</div></div></main>';
  var map={}; S.cal.comps.forEach(function(c){ map[compKey(c.task_id,c.occurrence_date)]=c; });
  var signed={}; S.cal.signoffs.forEach(function(s){ signed[s.day]=s; });
  var body='';
  if(S.cal.mode==='month'){
    var month=S.cal.anchor.slice(0,7);
    body='<div class="cal-grid">'+DOW.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
    for(var d=r.from; d<=r.to; d=Sched.addDays(d,1)){
      var inf=calDayInfo(d, base, map, today);
      var badge = inf.future ? (inf.due?'<div class="dpct f">'+inf.due+' due</div>':'') : (inf.due?'<div class="dpct '+pctClass(inf.pct)+'">'+inf.pct+'%</div>':'');
      var sub = inf.future ? '' : (inf.due ? inf.handled+'/'+inf.due+(inf.missed?' · '+inf.missed+' missed':'') : '');
      body+='<button class="cal-cell'+(d.slice(0,7)!==month?' other':'')+(d===today?' today':'')+'" data-a="calOpen" data-d="'+d+'" aria-label="'+fmtDay(d)+'">'+
        '<div class="dnum"><span>'+parseInt(d.slice(8),10)+'</span>'+(signed[d]?'<span title="Signed off">✅</span>':'')+'</div>'+badge+'<div class="dsub">'+sub+'</div></button>';
    }
    body+='</div>';
  } else {
    body='<div class="week-list">';
    for(var w=r.from; w<=r.to; w=Sched.addDays(w,1)){
      var wi=calDayInfo(w, base, map, today);
      var stats = wi.future ? plural(wi.due,'task')+' coming up' : (wi.due ? wi.handled+' of '+wi.due+' done'+(wi.missed?' · '+wi.missed+' missed':'') : 'Nothing scheduled');
      body+='<button class="week-row'+(w===today?' today':'')+'" data-a="calOpen" data-d="'+w+'"><div class="wd"><strong>'+DOW_LONG[Sched.weekday(w)-1]+'</strong><span>'+fmtDate(w)+(signed[w]?' · ✅ signed off':'')+'</span></div>'+
        '<div class="bar"><i style="width:'+(wi.future||!wi.due?0:wi.pct)+'%"></i></div><div class="wstats">'+(wi.future||!wi.due?'':'<strong>'+wi.pct+'%</strong> · ')+stats+'</div></button>';
    }
    body+='</div>';
  }
  return head+'<main><div class="wrap wrap-wide">'+tb+body+
    '<div class="disclaimer-box no-print"><strong>How to read this</strong>Percent = tasks done (or marked not needed) out of tasks due that day. Past days show history; future days show what’s coming up and can’t be ticked. ✅ = a manager signed the day off.</div></div></main>';
}

/* ---------- Overview ---------- */
async function loadOverview(){
  var sites=adminSites().filter(function(s){ return s.active; });
  var ids=sites.map(function(s){ return s.id; });
  var today=Sched.siteToday('Europe/London');
  var keys=uniq([today, Sched.weekStart(today), Sched.monthStart(today)]);
  var tasks=[], comps=[], signs=[];
  for(var i=0;i<ids.length;i+=20){
    var batch=ids.slice(i,i+20);
    var r = await Promise.all([
      fetchAll(function(){ return sb.from('tasks').select('*').in('site_id', batch).eq('active', true).order('id'); }),
      fetchAll(function(){ return sb.from('completions').select('task_id,occurrence_date,status,site_id').in('site_id', batch).in('occurrence_date', keys).order('id'); }),
      fetchAll(function(){ return sb.from('day_signoffs').select('site_id,day,signed_by_name').in('site_id', batch).eq('day', today).order('site_id'); })
    ]);
    tasks=tasks.concat(r[0]); comps=comps.concat(r[1]); signs=signs.concat(r[2]);
  }
  var carry=tasks.filter(function(t){ return t.if_missed==='carry'; }).map(function(t){ return t.id; });
  var from=Sched.addDays(today, -(S.settings.history_days||62)-31);
  var cj=chunk(carry, 80);
  for(var j=0;j<cj.length;j++){
    var ids2=cj[j];
    comps = comps.concat(await fetchAll(function(){ return sb.from('completions').select('task_id,occurrence_date,status,site_id').in('task_id', ids2).gte('occurrence_date', from).lt('occurrence_date', today).order('id'); }));
  }
  var map={}; comps.forEach(function(c){ map[compKey(c.task_id,c.occurrence_date)]=c; });
  var bySite={}; tasks.forEach(function(t){ (bySite[t.site_id]=bySite[t.site_id]||[]).push(t); });
  var rows = sites.map(function(s){
    var ts=bySite[s.id]||[], tz=s.timezone||'Europe/London', td=Sched.siteToday(tz), now=Sched.siteNowHM(tz);
    var items=Sched.itemsOn(ts, td), h=0, late=0;
    items.forEach(function(it){ var c=map[compKey(it.task.id,it.key)]; if(c) h++; else if(it.task.due_time && !Sched.isPeriod(it.task) && now>hm(it.task.due_time)) late++; });
    var od=Sched.outstanding(ts, function(id,k){ return !!map[compKey(id,k)]; }, td, S.settings.history_days||62).length;
    var so=signs.find(function(x){ return x.site_id===s.id; });
    return { site:s, due:items.length, handled:h, pct:pct(h, items.length), late:late, overdue:od, signoff:so, taskCount:ts.length };
  });
  S.admin.data.overview = { rows:rows, at:new Date().toISOString() };
}

var TYPE_LABELS = { once:'One-off', daily:'Every day', weekly:'Specific days of the week', monthly_day:'Monthly on a date', monthly_nth:'Monthly, e.g. first Monday', every_n_days:'Every few days', any_day_week:'Any day this week', any_day_month:'Any day this month' };
function filteredTasks(){
  var base=S.cache[S.admin.siteId]; if(!base) return [];
  var term=S.admin.search.trim().toLowerCase(), secOrder={};
  base.sections.forEach(function(s){ secOrder[s.id]=s.sort_order; });
  return base.tasks.filter(function(t){
    if(term && (t.title+' '+t.instructions).toLowerCase().indexOf(term)===-1) return false;
    if(S.admin.section && t.section_id!==S.admin.section) return false;
    if(S.admin.type && t.schedule_type!==S.admin.type) return false;
    if(S.admin.status==='active' && !t.active) return false;
    if(S.admin.status==='paused' && t.active) return false;
    if(S.admin.status==='carry' && t.if_missed!=='carry') return false;
    if(S.admin.aud && (t.audience||'team')!==S.admin.aud) return false;
    if(S.admin.area && (S.admin.area==='none' ? !!t.area_id : t.area_id!==S.admin.area)) return false;
    return true;
  }).sort(function(a,b){ return ((secOrder[a.section_id]||0)-(secOrder[b.section_id]||0)) || byOrder(a,b); });
}

function readForm(formEl, into){
  into = into || {};
  Array.prototype.forEach.call(formEl.querySelectorAll('[name]'), function(el){
    if(el.disabled) return;
    if(el.type==='checkbox'){
      if(/\[\]$/.test(el.name)){ var k=el.name.slice(0,-2); into[k]=into[k]||[]; if(el.checked) into[k].push(el.value); }
      else into[el.name]=el.checked;
    } else into[el.name]=el.value;
  });
  return into;
}
function syncModalForm(){
  var formEl=document.querySelector('#modal form');
  if(formEl && S.modal && S.modal.form){
    Array.prototype.forEach.call(formEl.querySelectorAll('input[type=checkbox][name$="[]"]'), function(el){ S.modal.form[el.name.slice(0,-2)]=[]; });
    readForm(formEl, S.modal.form);
  }
}
function taskRowFromForm(f, lib){
  var title=(f.title||'').trim();
  if(!title) throw new Error('Please give the task a name.');
  var type=f.schedule_type;
  var checklist = (f.checklist_text!==undefined ? f.checklist_text.split('\n') : (f.checklist||[])).map(function(x){ return x.trim(); }).filter(Boolean);
  if(checklist.length>40) throw new Error('A checklist can have up to 40 parts.');
  var row = { title:title, instructions:(f.instructions||'').trim(), checklist:checklist, schedule_type:type,
    interval_n: ['weekly','monthly_day','monthly_nth','every_n_days'].indexOf(type)!==-1 ? Math.max(1, Math.min(365, parseInt(f.interval_n,10)||1)) : 1,
    weekdays: type==='weekly' ? f.weekdays.slice().sort() : [],
    month_day: type==='monthly_day' ? parseInt(f.month_day,10) : null,
    nth: type==='monthly_nth' ? parseInt(f.nth,10) : null,
    nth_weekday: type==='monthly_nth' ? parseInt(f.nth_weekday,10) : null,
    due_time: (type==='any_day_week'||type==='any_day_month') ? null : (f.due_time||null),
    if_missed: f.if_missed==='carry'?'carry':'miss' };
  if(type==='weekly' && !row.weekdays.length) throw new Error('Choose at least one day of the week.');
  row.audience = f.audience==='management' ? 'management' : 'team';
  if(lib){ row.section_name=(f.section_name||'').trim(); row.area_name=(f.area_name||'').trim(); return row; }
  row.area_id = f.area_id || null;
  if(!f.section_id) throw new Error('Please choose a section.');
  if(!f.start_date) throw new Error('Please choose a start date.');
  if(f.end_date && f.end_date < f.start_date) throw new Error('The end date can’t be before the start date.');
  row.section_id=f.section_id; row.start_date=f.start_date; row.end_date=type==='once'?null:(f.end_date||null); row.active=!!f.active;
  return row;
}
async function saveTaskForm(){
  var m=S.modal, f=m.form;
  var row=taskRowFromForm(f, m.library);
  if(m.library){
    if(m.id) await one(sb.from('library_tasks').update(row).eq('id', m.id));
    else await one(sb.from('library_tasks').insert(row));
    S.admin.data.library = await fetchAll(function(){ return sb.from('library_tasks').select('*').order('title').order('id'); });
    return;
  }
  row.site_id=m.siteId;
  if(m.id){ await one(sb.from('tasks').update(row).eq('id', m.id)); }
  else {
    var base=S.cache[m.siteId];
    row.sort_order = base.tasks.filter(function(t){ return t.section_id===row.section_id; }).reduce(function(mx,t){ return Math.max(mx, t.sort_order||0); }, 0)+1;
    await one(sb.from('tasks').insert(row));
  }
  await loadSiteBase(m.siteId, true);
  if(S.day.loadedFor.indexOf(m.siteId)===0){ S.day.loadedFor=''; }
}
